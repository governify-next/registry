                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665f1a2b3c4d5e6f7a8b9c0d
                                      name: tpa-US-PSG2-2526
                                      displayName: TPA US PSG2 2526
                                      description: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                                      orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                      isPublic: true
                                      __v: 0
                                      guarantees:
                                          - guaranteeTemplateName: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_BRANCHESASSOCIATED_INPROGRESSISSUES
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_INREVIEWISSUES_OPENPR
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_DONEISSUES_MERGEDPR
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_INPROGRESSISSUES_HOURLY_UNDER_1
                                            comparator: '<='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_DONEISSUES_WEEKLY_OVER_1
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_TEAM
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_MEMBER
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_APPROVEDMERGEDPULLREQUEST_MEMBER
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER_AND_COUNTPR
                                            comparator: '>='
                                            threshold: 20
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                error: null
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - AgreementTemplates
            summary: Create an agreement template
            operationId: createAgreementTemplateByOrganization
            description: |
                Creates a new agreement template within the specified organization,
                along with its associated guarantees. Each guarantee references an existing
                GuaranteeTemplate by name and injects the concrete comparator, threshold and window when the agreement is enforced.
                The template name must be unique within the organization.
            requestBody:
                $ref: '#/components/requestBodies/AgreementTemplateBody'
            responses:
                '200':
                    description: Agreement template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: Agreement template created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665f1a2b3c4d5e6f7a8b9c0d
                                    name: tpa-US-PSG2-2526
                                    displayName: TPA US PSG2 2526
                                    description: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                                    orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                    isPublic: true
                                    __v: 0
                                    guarantees:

    /api/v1/guaranteeTemplates:
        get:
            tags:
                - GuaranteeTemplates
            summary: List all guarantee templates
            operationId: getGuaranteeTemplates
            description: |
                Returns all guarantee templates in the system, each one assembled
                with its associated metricsConfig array.
            responses:
                '200':
                    description: List of guarantee templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                      info:
                                          title: Number of Commits by Team
                                          description: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                                          example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                                      numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                      comparator: null
                                      threshold: null
                                      window: null
                                      __v: 0
                                      metricsConfig:
                                          - name: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                            config: {}
                                error: null
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - GuaranteeTemplates
            summary: Create a guarantee template
            operationId: createGuaranteeTemplate
            description: |
                Creates a new guarantee template along with its metric configurations.
                The fields `comparator`, `threshold` and `window` must be explicitly set to `null`,
                as these values are injected later by the AgreementTemplate.
                The `numericExpression` must be a valid mathematical expression referencing
                exactly the metrics declared in `metricsConfig` (bidirectional consistency).
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateBody'
            responses:
                '200':
                    description: Guarantee template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                    info:
                                        title: Number of Commits by Team
                                        description: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                                        example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                                    numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metricsConfig:
                                        - name: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                          config: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/guaranteeTemplates/{guaranteeName}:
        parameters:
            - $ref: '#/components/parameters/guaranteeName'
        get:
            tags:
                - GuaranteeTemplates
            summary: Get a guarantee template by name
            operationId: getGuaranteeTemplate
            description: |
                Returns a specific guarantee template identified by its unique name,
                assembled with its associated metricsConfig array.
            responses:
                '200':
                    description: Guarantee template found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - GuaranteeTemplates
            summary: Update a guarantee template
            operationId: updateGuaranteeTemplate
            description: |
                Updates an existing guarantee template. All modifiable fields must be sent
                in the body: `name`, `info`, `numericExpression` and `metricsConfig`.
                Fields `comparator`, `threshold` and `window` are not modifiable and are
                silently ignored if sent.
                If the `name` changes, the new name must be unique in the system.
                The metricsConfig array is fully replaced (wipe-and-replace strategy).
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateUpdateBody'
            responses:
                '200':
                    description: Guarantee template updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template updated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                    info:
                                        title: Updated Title
                                        description: Updated description.
                                        example: Updated example.
                                    numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metricsConfig:
                                        - name: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                          config: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - GuaranteeTemplates
            summary: Delete a guarantee template
            operationId: deleteGuaranteeTemplate
            description: |
                Permanently deletes a guarantee template and all its associated
                metric configurations (MetricConfig documents).
            responses:
                '200':
                    description: Guarantee template deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                            example:
                                success: true
                                message: Guarantee template deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Security Schemes ─────────────────────────
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT token obtained via POST /api/v1/users/login

    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        elementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the element field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: johndoe
        guaranteeName:
            name: guaranteeName
            in: path
            required: true
            description: Unique name of the guarantee template
            schema:
                type: string
            example: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: Data to create or update an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        RoleBody:
            description: Data to create or update a role
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        FieldBody:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Element title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementFieldInput'
                    examples:
                        numericField:
                            summary: Numeric guarantee field
                            value:
                                name: minResponseTime
                                description: Minimum response time in hours
                                type: number
                        enumField:
                            summary: Enum guarantee level field
                            value:
                                name: guaranteeLevel
                                description: Service level guarantee tier
                                type: enum
                                value:
                                    - gold
                                    - silver
                                    - bronze

        MemberBody:
            description: Data to add a user to an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MemberInput'
                    example:
                        username: johndoe

        GuaranteeTemplateBody:
            description: Data to create a guarantee template
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/GuaranteeTemplateCreateInput'
                    example:
                        name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                        info:
                            title: Number of Commits by Team
                            description: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                            example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                        numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                        comparator: null
                        threshold: null
                        window: null
                        metricsConfig:
                            - name: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                              config: {}

        GuaranteeTemplateUpdateBody:
            description: Data to update a guarantee template
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/GuaranteeTemplateUpdateInput'
                    example:
                        name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                        info:
                            title: Updated Title
                            description: Updated description.
                            example: Updated example.
                        numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                        metricsConfig:
                            - name: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                              config: {}


    # ──────────────────────────────────────────────
    # States
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/states:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersionSelector'
        get:
            tags:
                - States
            summary: Get states for a selected agreement version
            operationId: getStatesForAgreementVersion
            description: |
                Returns the fully assembled selected agreement version and groups every stored
                state under the signature that produced it.
            responses:
                '200':
                    description: States retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object

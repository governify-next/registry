    # ──────────────────────────────────────────────
    # Fetchers
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/elements/{elementName}/agreementCollections/{agColName}/agreementVersions/auditableVersion/fetchers/fetch:
        post:
            tags:
                - Fetchers
            summary: Generate fetch results for auditable agreement version
            operationId: fetchAuditableVersionFetchResults
            parameters:
                - $ref: '#/components/parameters/orgName'
                - $ref: '#/components/parameters/elementName'
                - $ref: '#/components/parameters/agColName'
                - in: query
                  name: expand
                  required: false
                  schema:
                      type: boolean
                  description: If true, returns full fetch results. By default, only fetch result ids are returned.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - date
                            properties:
                                date:
                                    type: string
                                    format: date-time
                        example:
                            date: '2026-05-19T00:00:00.000Z'
            responses:
                '200':
                    description: Fetch results generated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  type: string
                            example:
                                success: true
                                message: Fetch results generated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - 665e5f6a7b8c9d0e1f2a3b4c
                                error: null
                '207':
                    description: Generation completed with one or more non-completed fetch results
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  type: string
                            example:
                                success: true
                                message: Fetch results generated with failures
                                httpStatus: 207
                                appCode: SUCCESS
                                data:
                                    - 665e5f6a7b8c9d0e1f2a3b4d
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'

# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        elementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the element field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: janedoe
        guaranteeName:
            name: guaranteeName
            in: path
            required: true
            description: Unique name of the guarantee template
            schema:
                type: string
            example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
        agreementTemplateName:
            name: agreementTemplateName
            in: path
            required: true
            description: Unique name of the agreement template within the organization
            schema:
                type: string
            example: tpa-US-PSG2-2526
        elementName:
            name: elementName
            in: path
            required: true
            description: Unique name of the element within the organization
            schema:
                type: string
            example: L1-01
        agColName:
            name: agColName
            in: path
            required: true
            description: Unique name of the agreement collection within the element
            schema:
                type: string
            example: tpa-US-PSG2-2526
        versionNumber:
            name: versionNumber
            in: path
            required: true
            description: Version number of the agreement version
            schema:
                type: integer
                minimum: 1
            example: 1
        partId:
            name: partId
            in: path
            required: true
            description: MongoDB ObjectId of the element part
            schema:
                type: string
            example: 665c2d3e4f5a6b7c8d9e0f1a
        permissionName:
            name: permissionName
            in: path
            required: true
            description: Permission type (view, edit, delete, create)
            schema:
                type: string
                enum: [view, edit, delete, create]
            example: view

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: Data to create or update an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        RoleBody:
            description: Data to create or update a role
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        FieldBody:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Element title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementFieldInput'
                    examples:
                        numericField:
                            summary: Numeric guarantee field
                            value:
                                name: minResponseTime
                                description: Minimum response time in hours
                                type: number
                        enumField:
                            summary: Enum guarantee level field
                            value:
                                name: guaranteeLevel
                                description: Service level guarantee tier
                                type: enum
                                value:
                                    - gold
                                    - silver
                                    - bronze

        MemberBody:
            description: Data to add a user to an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MemberInput'
                    example:
                        username: janedoe

        ElementBody:
            description: Data to create or update an element
            required: true
            content:
                application/json:
                    schema:

openapi: 3.0.0
info:
    title: Registry API
    version: 1.0.0
    description: |
        REST API for managing organizations, their roles, element fields
        and agreement fields within Registry API.

        Each organization is the main container in the system: it groups elements,
        defines the vocabulary they must follow and establishes the available roles.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: GuaranteeTemplates
      description: Guarantee template management
    - name: AgreementTemplates
      description: Agreement template management within an organization
    - name: AgreementCollections
      description: Agreement collection management within an element
    - name: AgreementVersions
      description: Agreement version management within a collection

paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string

    # ──────────────────────────────────────────────
    # GuaranteeTemplates
    # ──────────────────────────────────────────────
    /api/v1/guaranteeTemplates:
        get:
            tags:
                - GuaranteeTemplates
            summary: List all guarantee templates
            operationId: getGuaranteeTemplates
            description: |
                Returns all guarantee templates in the system, each one with its
                embedded metrics array.
            responses:
                '200':
                    description: List of guarantee templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                      info:
                                          title: Number of Commits by Team
                                          description: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                                          example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                                      numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                      comparator: null
                                      threshold: null
                                      window: null
                                      __v: 0
                                      metrics:
                                          - metricName: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                            event:
                                                eventId: EV_GITHUB_COMMITS
                                                fetcherConfigs:
                                                    - fetcherId: FT_REST_GITHUB_COMMITS
                                                      fetcherConfig: null
                                                processConfig: null
                                            aggregation:
                                                aggregatorType: count
                                                aggregatorConfig: {}
                                error: null
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - GuaranteeTemplates
            summary: Create a guarantee template
            operationId: createGuaranteeTemplate
            description: |
                Creates a new guarantee template with embedded metrics.
                The fields `comparator`, `threshold` and `window` must be explicitly set to `null`,
                as these values are injected later by the AgreementTemplate.
                The `numericExpression` must be a valid mathematical expression referencing
                exactly the metrics declared in `metrics` (bidirectional consistency).
                Each metric's eventId, fetcherId and aggregatorType are validated against the computer and collector.
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateBody'
            responses:
                '200':
                    description: Guarantee template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                    info:
                                        title: Number of Commits by Team
                                        description: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                                        example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                                    numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metrics:
                                        - metricName: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                          event:
                                              eventId: EV_GITHUB_COMMITS
                                              fetcherConfigs:
                                                  - fetcherId: FT_REST_GITHUB_COMMITS
                                                    fetcherConfig: null
                                              processConfig: null
                                          aggregation:
                                              aggregatorType: count
                                              aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/guaranteeTemplates/{guaranteeName}:
        parameters:
            - $ref: '#/components/parameters/guaranteeName'
        get:
            tags:
                - GuaranteeTemplates
            summary: Get a guarantee template by name
            operationId: getGuaranteeTemplate
            description: |
                Returns a specific guarantee template identified by its unique name,
                with its embedded metrics array.
            responses:
                '200':
                    description: Guarantee template found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - GuaranteeTemplates
            summary: Update a guarantee template
            operationId: updateGuaranteeTemplate
            description: |
                Updates an existing guarantee template. All modifiable fields must be sent
                in the body: `name`, `info`, `numericExpression` and `metrics`.
                Fields `comparator`, `threshold` and `window` are not modifiable and are
                silently ignored if sent.
                If the `name` changes, the new name must be unique in the system.
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateUpdateBody'
            responses:
                '200':
                    description: Guarantee template updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template updated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                    info:
                                        title: Updated Title
                                        description: Updated description.
                                        example: Updated example.
                                    numericExpression: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metrics:
                                        - metricName: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                                          event:
                                              eventId: EV_GITHUB_COMMITS
                                              fetcherConfigs:
                                                  - fetcherId: FT_REST_GITHUB_COMMITS
                                                    fetcherConfig: null
                                              processConfig: null
                                          aggregation:
                                              aggregatorType: count
                                              aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - GuaranteeTemplates
            summary: Delete a guarantee template
            operationId: deleteGuaranteeTemplate
            description: |
                Permanently deletes a guarantee template.
            responses:
                '200':
                    description: Guarantee template deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                            example:
                                success: true
                                message: Guarantee template deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # AgreementTemplates
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/agreementTemplates:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - AgreementTemplates
            summary: List all agreement templates in an organization
            operationId: getAgreementTemplatesByOrganization
            description: |
                Returns all agreement templates belonging to the specified organization,
                each one assembled with its associated guarantees array.
            responses:
                '200':
                    description: List of agreement templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665f1a2b3c4d5e6f7a8b9c0d
                                      name: PSG2-2526
                                      displayName: PSG2-2526 Agreement
                                      description: This is a sample agreement template for PSG2-2526.
                                      orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                      isPublic: true
                                      __v: 0
                                      guarantees:
                                          - guaranteeTemplateName: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                            comparator: '>='
                                            threshold: 5
                                            window:
                                                period:
                                                    - unit: day
                                                      value: 1
                                                anchorDate: '2025-12-08T21:00:00.000Z'
                                error: null
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - AgreementTemplates
            summary: Create an agreement template
            operationId: createAgreementTemplateByOrganization
            description: |
                Creates a new agreement template within the specified organization,
                along with its associated guarantees. Each guarantee references an existing
                GuaranteeTemplate by name and injects the concrete comparator, threshold and window when the agreement is enforced.
                The template name must be unique within the organization.
            requestBody:
                $ref: '#/components/requestBodies/AgreementTemplateBody'
            responses:
                '200':
                    description: Agreement template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: Agreement template created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665f1a2b3c4d5e6f7a8b9c0d
                                    name: PSG2-2526
                                    displayName: PSG2-2526 Agreement
                                    description: This is a sample agreement template for PSG2-2526.
                                    orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                    isPublic: true
                                    __v: 0
                                    guarantees:
                                        - guaranteeTemplateName: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                          comparator: '>='
                                          threshold: 5
                                          window:
                                              period:
                                                  - unit: day
                                                    value: 1
                                              anchorDate: '2025-12-08T21:00:00.000Z'
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/AgreementTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/agreementTemplates/{agreementTemplateName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/agreementTemplateName'
        get:
            tags:
                - AgreementTemplates
            summary: Get an agreement template by name
            operationId: getAgreementTemplateByOrganization
            description: |
                Returns a specific agreement template identified by its name within the
                organization, assembled with its associated guarantees array.
            responses:
                '200':
                    description: Agreement template found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                '404':
                    $ref: '#/components/responses/AgreementTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - AgreementTemplates
            summary: Update an agreement template
            operationId: updateAgreementTemplateByOrganization
            description: |
                Updates an existing agreement template. All fields must be sent in the body.
                If the name changes, the new name must be unique within the organization.
                The guarantees array is fully replaced (wipe-and-replace strategy).
            requestBody:
                $ref: '#/components/requestBodies/AgreementTemplateBody'
            responses:
                '200':
                    description: Agreement template updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: Agreement template updated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665f1a2b3c4d5e6f7a8b9c0d
                                    name: PSG2-2526-v2
                                    displayName: PSG2-2526 Agreement V2
                                    description: Updated agreement template for PSG2-2526.
                                    orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                    isPublic: false
                                    __v: 0
                                    guarantees:
                                        - guaranteeTemplateName: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                                          comparator: '>='
                                          threshold: 10
                                          window:
                                              period:
                                                  - unit: day
                                                    value: 1
                                              anchorDate: '2025-12-08T21:00:00.000Z'
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AgreementTemplateNotFound'
                '409':
                    $ref: '#/components/responses/AgreementTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - AgreementTemplates
            summary: Delete an agreement template
            operationId: deleteAgreementTemplateByOrganization
            description: |
                Permanently deletes an agreement template and all its associated
                guarantees (Guarantee documents).
            responses:
                '200':
                    description: Agreement template deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                            example:
                                success: true
                                message: Agreement template deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '404':
                    $ref: '#/components/responses/AgreementTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/agreementTemplates/public:
        get:
            tags:
                - AgreementTemplates
            summary: List all public agreement templates
            operationId: getPublicAgreementTemplates
            description: |
                Returns all agreement templates marked as public, regardless of organization.
            responses:
                '200':
                    description: List of public agreement templates
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AgreementTemplate'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # AgreementCollections
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/elements/{elementName}/agreementCollections:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/elementName'
        get:
            tags:
                - AgreementCollections
            summary: List all agreement collections in an element
            operationId: getAgreementCollectionsByElement
            description: |
                Returns all agreement collections belonging to the specified element.
            responses:
                '200':
                    description: List of agreement collections retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AgreementCollection'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 69cbe9901d5009a04361925d
                                      name: acuerdo-PSG2-2526
                                      displayName: Acuerdo PSG2 2025-2026
                                      elementId: 69cbdee759092b362376ca17
                                      auditableVersionNumber: 1
                                      agreementVersions:
                                          - contract:
                                                validity:
                                                    timezone: Europe/Madrid
                                                    initial: '2026-03-31T00:00:00.000Z'
                                                    end: '2026-12-31T23:59:59.000Z'
                                                    earlyTermination: null
                                                agreementTemplateId: 69cbd30332c8b7152e9aa73a
                                                signaturesId:
                                                    - 69cbea571d5009a043619276
                                            versionNumber: 1
                                      fields: []
                                      permissions: []
                                      __v: 0
                                error: null
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - AgreementCollections
            summary: Create an agreement collection
            operationId: createAgreementCollectionByElement
            description: |
                Creates a new agreement collection within the specified element.
                The collection is created empty (no versions). Versions are added later
                through the agreement version endpoints.
            requestBody:
                $ref: '#/components/requestBodies/AgreementCollectionBody'
            responses:
                '200':
                    description: Agreement collection created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementCollection'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 69cbe9901d5009a04361925d
                                    name: acuerdo-PSG2-2526
                                    displayName: Acuerdo PSG2 2025-2026
                                    elementId: 69cbdee759092b362376ca17
                                    auditableVersionNumber: null
                                    agreementVersions: []
                                    fields: []
                                    permissions: []
                                    __v: 0
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/elements/{elementName}/agreementCollections/{agColName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/elementName'
            - $ref: '#/components/parameters/agColName'
        get:
            tags:
                - AgreementCollections
            summary: Get an agreement collection by name
            operationId: getAgreementCollectionByElement
            description: |
                Returns a specific agreement collection by name within the element.
                Supports an optional `expand` query parameter to assemble version data
                with resolved signatures, guarantees and metric configurations.
            parameters:
                - in: query
                  name: expand
                  schema:
                      type: string
                      enum: ['true', 'false']
                      default: 'false'
                  description: If `true`, returns versions with fully assembled signature and guarantee data.
            responses:
                '200':
                    description: Agreement collection found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementCollection'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 69cbe9901d5009a04361925d
                                    name: acuerdo-PSG2-2526
                                    displayName: Acuerdo PSG2 2025-2026
                                    elementId: 69cbdee759092b362376ca17
                                    auditableVersionNumber: 1
                                    agreementVersions:
                                        - contract:
                                              validity:
                                                  timezone: Europe/Madrid
                                                  initial: '2026-03-31T00:00:00.000Z'
                                                  end: '2026-12-31T23:59:59.000Z'
                                                  earlyTermination: null
                                              agreementTemplateId: 69cbd30332c8b7152e9aa73a
                                              signaturesId:
                                                  - 69cbea571d5009a043619276
                                          versionNumber: 1
                                    fields: []
                                    permissions: []
                                    __v: 0
                                error: null
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - AgreementCollections
            summary: Update an agreement collection
            operationId: updateAgreementCollectionByElement
            description: |
                Updates an existing agreement collection within the element.
                The `auditableVersionNumber` can be changed to point to a different version
                or set to `null` if no version should be auditable.
            requestBody:
                $ref: '#/components/requestBodies/AgreementCollectionUpdateBody'
            responses:
                '200':
                    description: Agreement collection updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementCollection'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 69cbe9901d5009a04361925d
                                    name: acuerdo-PSG2-2526
                                    displayName: Acuerdo PSG2 2025-2026 (actualizado)
                                    elementId: 69cbdee759092b362376ca17
                                    auditableVersionNumber: null
                                    agreementVersions:
                                        - contract:
                                              validity:
                                                  timezone: Europe/Madrid
                                                  initial: '2026-03-31T00:00:00.000Z'
                                                  end: '2026-12-31T23:59:59.000Z'
                                                  earlyTermination: null
                                              agreementTemplateId: 69cbd30332c8b7152e9aa73a
                                              signaturesId:
                                                  - 69cbea571d5009a043619276
                                          versionNumber: 1
                                    fields: []
                                    permissions: []
                                    __v: 0
                                    updatedAt: '2026-03-31T18:26:00.438Z'
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - AgreementCollections
            summary: Delete an agreement collection
            operationId: deleteAgreementCollectionByElement
            description: |
                Deletes an agreement collection and all its associated versions and signatures.
            responses:
                '200':
                    description: Agreement collection deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # AgreementVersions
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/elements/{elementName}/agreementCollections/{agColName}/agreementVersions:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/elementName'
            - $ref: '#/components/parameters/agColName'
        get:
            tags:
                - AgreementVersions
            summary: List all versions in a collection

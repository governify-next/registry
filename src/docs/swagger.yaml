                        data: null
                        error:
                            message: "Guarantee template 'GR_NONEXISTENT' not found"
                            details: null
        GuaranteeTemplateConflict:
            description: A guarantee template with that name already exists
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Guarantee template 'CORRELATION_INPROGRESSISSUES_NEWBRANCH' already exists"
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: "Guarantee template 'CORRELATION_INPROGRESSISSUES_NEWBRANCH' already exists"
                            details: null
        ElementNotFound:
            description: The element was not found in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Element with name 'L1-01' not found in organization"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "Element with name 'L1-01' not found in organization"
                            details: null
        MemberNotFound:
            description: The user is not a member of the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "The user 'johndoe' does not exist in organization 'universidad-sevilla'"
                        httpStatus: 400
                        appCode: VALIDATION_ERROR
                        data: null
                        error:
                            message: "The user 'johndoe' does not exist in organization 'universidad-sevilla'"
                            details: null
        Unauthorized:
            description: Missing or invalid authentication token
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Authorization header missing or malformed
                        httpStatus: 401
                        appCode: UNAUTHORIZED
                        data: null
                        error:
                            message: Authorization header missing or malformed
                            details: null
        Forbidden:
            description: Insufficient permissions to perform this action
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: You do not have permission to perform that action
                        httpStatus: 403
                        appCode: FORBIDDEN
                        data: null
                        error:
                            message: You do not have permission to perform that action
                            details: null
        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Internal server error
                        httpStatus: 500
                        appCode: UNKNOWN_ERROR
                        data: null
                        error:
                            message: Internal server error
                            details: null
        ExternalServiceError:
            description: External service error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: External service error
                        httpStatus: 422
                        appCode: EXTERNAL_SERVICE_ERROR
                        data: null
                        error:
                            message: External service error
                            details: null

    # ── Schemas ───────────────────────────────────
    schemas:
        # ── Standard response ────────────────────
        SuccessResponse:
            type: object
            description: Standard wrapper for all successful API responses
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        ErrorResponse:
            type: object
            description: Standard wrapper for all error API responses
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            description: Additional error information (may be null)
                            type: object
                            nullable: true
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        # ── Organization ─────────────────────────
        Organization:
            type: object
            description: |
                Main container of the system. Defines the structure of its elements,
                the structure of its agreements and the available roles.
            required:
                - _id
                - name
                - description
                - elementFields
                - agreementFields
                - roles
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                name:
                    type: string
                    description: Unique organization name (used as identifier in the API). Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters. Defaults to empty string.
                    maxLength: 200
                    default: ''
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla
                elementFields:
                    type: array
                    description: Fields that define the structure of elements
                    items:
                        $ref: '#/components/schemas/ElementField'
                agreementFields:
                    type: array
                    description: Fields that define the structure of agreements
                    items:
                        $ref: '#/components/schemas/AgreementField'
                roles:
                    type: array
                    description: Available roles within the organization
                    items:
                        $ref: '#/components/schemas/Role'
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        OrganizationInput:
            type: object
            description: Data required to create or update an organization
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Unique organization name. Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters.
                    maxLength: 200
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla

        # ── Role ─────────────────────────────────
        Role:
            type: object
            description: Role within an organization (e.g. admin, teacher, student)
            required:
                - _id
                - name
                - description
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (subdocument ObjectId)
                    example: 665b2c3d4e5f6a7b8c9d0e1f
                name:
                    type: string
                    description: Role name (unique within the organization)
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    maxLength: 500
                    example: Organization administrator

        RoleInput:
            type: object
            description: Data required to create or update a role
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Role name (unique within the organization)
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    maxLength: 500
                    example: Organization administrator

        # ── Membership ──────────────────────────
        Membership:
            type: object
            description: Represents the relationship between a user and an organization
            required:
                - _id
                - organizationId
                - userId
                - rolesId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c3d4e5f6a7b8c9d0e1f2a
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                userId:
                    type: string
                    description: User ObjectId reference
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                rolesId:
                    type: array
                    description: Array of Role ObjectId references assigned to the user
                    items:
                        type: string
                    example: []
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        MemberInput:
            type: object
            description: Data required to add a user to an organization
            required:
                - username
            properties:
                username:
                    type: string
                    description: Username of the user to add
                    example: janedoe

        # ── Element ─────────────────────────────
        Element:
            type: object
            description: An element within an organization (e.g. a team or project)
            required:
                - _id
                - name
                - description
                - organizationId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665b1c2d3e4f5a6b7c8d9e0f
                name:
                    type: string
                    description: Unique element name within the organization
                    example: L1-01
                description:
                    type: string
                    example: Equipo L1-01 de PSG2
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                fields:
                    type: array
                    description: Element fields (must match organization's elementFields)
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    description: Role-based permissions for this element (arrays of role ObjectIds)
                auditConfig:
                    type: object
                    description: Audit configuration for this element
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project
                parts:
                    type: array
                    description: Sub-parts of this element, each with its own auditConfig
                    items:
                        $ref: '#/components/schemas/ElementPart'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                __v:
                    type: integer
                    example: 0

        ElementPart:
            type: object
            description: A sub-part within an element
            required:
                - _id
                - auditConfig
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c2d3e4f5a6b7c8d9e0f1a
                auditConfig:
                    type: object
                    description: Audit configuration for this part
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project

        ElementInput:
            type: object
            description: Payload for creating or updating an element
            required:
                - name
                - description
                - fields
                - permissions
                - auditConfig
                - parts
            properties:
                name:
                    type: string
                    maxLength: 100
                    example: L1-01
                description:
                    type: string
                    maxLength: 500
                    example: Equipo L1-01 de PSG2
                fields:
                    type: array
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    example:
                        view: []
                        edit: []
                        delete: []
                        create: []
                auditConfig:
                    type: object
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project
                parts:
                    type: array
                    items:
                        type: object
                        required:
                            - auditConfig
                        properties:
                            auditConfig:
                                type: object
                    example: []

        ElementPartInput:
            type: object
            description: Payload for creating or updating an element part
            required:
                - auditConfig
            properties:
                auditConfig:
                    type: object
                    description: Audit configuration for this part
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project

        # ── Base field properties (shared) ──────
        FieldBase:
            type: object
            required:
                - name
                - description
                - type
            properties:
                name:
                    type: string
                    description: Field name (unique within its array)
                    maxLength: 100
                description:
                    type: string
                    description: Field description
                    maxLength: 500
                type:
                    type: string
                    description: Field type
                    enum:
                        - string
                        - enum
                        - number

        # ── ElementField ─────────────────────────
        ElementField:
            description: |
                Field that defines part of the structure of an organization's elements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string

        ElementFieldInput:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string

        # ── AgreementField ──────────────────────
        AgreementField:
            description: |
                Field that defines part of the structure of an organization's agreements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        AgreementFieldInput:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        # ── User ─────────────────────
        User:
            type: object
            description: Represents a user in the system
            required:
                - _id
                - username
                - email
                - name
                - surname
                - systemRole
            properties:
                _id:
                    type: string
                    description: MongoDB ObjectId
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                username:
                    type: string
                    description: Unique username (3-50 characters)
                    minLength: 3
                    maxLength: 50
                    example: johndoe
                email:
                    type: string
                    format: email
                    description: User email address
                    example: john@example.com
                name:
                    type: string
                    description: User's first name (2-30 characters)
                    minLength: 2
                    maxLength: 30
                    example: John
                surname:
                    type: string
                    description: User's last name (2-50 characters)
                    minLength: 2
                    maxLength: 50
                    example: Doe
                systemRole:
                    type: string
                    description: System-level role
                    enum: [ADMIN, USER]
                    example: ADMIN
                createdAt:
                    type: string
                    format: date-time
                    example: '2025-06-01T12:00:00.000Z'
                updatedAt:
                    type: string
                    format: date-time
                    example: '2025-06-01T12:00:00.000Z'

        UserInput:
            type: object
            description: Request payload for creating or updating a user
            required:
                - username
                - email
                - password
                - name
                - surname
                - systemRole
            properties:
                username:
                    type: string
                    description: Unique username (3-50 characters)
                    minLength: 3
                    maxLength: 50
                    example: johndoe
                email:
                    type: string
                    format: email
                    description: Valid email address
                    example: john@example.com
                password:
                    type: string
                    description: Password (minimum 6 characters)
                    minLength: 6
                    example: securePassword123
                name:
                    type: string
                    description: User's first name (2-30 characters)
                    minLength: 2
                    maxLength: 30
                    example: John
                surname:
                    type: string
                    description: User's last name (2-50 characters)
                    minLength: 2
                    maxLength: 50
                    example: Doe
                systemRole:
                    type: string
                    description: System-level role
                    enum: [ADMIN, USER]
                    example: USER

        LoginInput:
            type: object
            description: Request payload for user login
            required:
                - login
                - password
            properties:
                login:
                    type: string
                    description: Login identifier - can be username or email (3-100 characters)
                    minLength: 3
                    maxLength: 100
                    example: johndoe
                password:
                    type: string
                    description: User password (minimum 6 characters)
                    minLength: 6
                    example: securePassword123

        # ── AgreementTemplate ──────────────────────
        AgreementTemplate:
            type: object
            description: |
                An agreement template defines a set of guarantees for an organization.
                Each guarantee references a GuaranteeTemplate and injects concrete values
                for comparator, threshold and window.
            required:
                - _id
                - name
                - orgId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665f1a2b3c4d5e6f7a8b9c0d
                name:
                    type: string
                    description: Template name, unique within the organization. Only letters, numbers, hyphens and underscores.
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: tpa-US-PSG2-2526
                displayName:
                    type: string
                    description: Human-readable display name (max 200 characters)
                    maxLength: 200
                    example: TPA US PSG2 2526
                description:
                    type: string
                    description: Template description (max 500 characters)
                    maxLength: 500
                    example: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                orgId:
                    type: string
                    description: ObjectId of the organization this template belongs to
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                isPublic:
                    type: boolean
                    description: Whether this template is publicly visible
                    example: true
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0
                guarantees:
                    type: array
                    description: Guarantees associated with this template (assembled from Guarantee documents)
                    items:
                        $ref: '#/components/schemas/IGuaranteeEntry'

        IGuaranteeEntry:
            type: object
            description: A guarantee entry within an agreement template
            required:
                - guaranteeTemplateName
                - comparator
                - threshold
                - window
            properties:
                guaranteeTemplateName:
                    type: string
                    description: Name of the referenced GuaranteeTemplate (3-100 characters)
                    minLength: 3
                    maxLength: 100
                    example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                comparator:
                    type: string
                    description: Comparison operator for the guarantee condition
                    enum: ['<', '>', '<=', '>=', '==', '!=']
                    example: '>='
                threshold:
                    type: number
                    description: Numeric threshold for the guarantee condition
                    example: 75
                window:
                    type: object
                    description: Time window for evaluating the guarantee
                    required:
                        - period
                        - anchorDate
                    properties:
                        period:
                            type: array
                            description: Time period components
                            minItems: 1
                            items:
                                type: object
                                required:
                                    - unit
                                    - value
                                properties:
                                    unit:
                                        type: string
                                        enum: [millisecond, second, minute, hour, day, week]
                                        example: day
                                    value:
                                        type: integer
                                        minimum: 1
                                        description: Duration value (strictly greater than 0)
                                        example: 7
                        anchorDate:
                            type: string
                            format: date-time
                            description: ISO 8601 anchor date (between year 2000 and 2100)
                            example: '2025-01-01T00:00:00.000Z'

        AgreementTemplateInput:
            type: object
            description: |
                Payload for creating or updating an agreement template.
                Each guarantee must reference an existing GuaranteeTemplate by name.
                No duplicate GuaranteeTemplate names are allowed within the same agreement.
            required:
                - name
                - displayName
                - description
                - isPublic
                - guarantees
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: tpa-US-PSG2-2526
                displayName:
                    type: string
                    maxLength: 200
                    example: TPA US PSG2 2526
                description:
                    type: string
                    maxLength: 500
                    example: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                isPublic:
                    type: boolean
                    example: true
                guarantees:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/IGuaranteeEntry'

        # ── GuaranteeTemplate ──────────────────────
        GuaranteeTemplate:
            type: object
            description: |
                Theoretical definition of a guarantee condition. By itself it has no specific
                objective — the comparator, threshold and window are injected by the
                AgreementTemplate when it references this template.
            required:
                - _id
                - name
                - info
                - numericExpression
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665e5f6a7b8c9d0e1f2a3b4c
                name:
                    type: string
                    description: Unique template name. Only letters, numbers, hyphens and underscores.
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                info:
                    type: object
                    description: Human-readable information about the guarantee
                    required:
                        - title
                    properties:
                        title:
                            type: string
                            description: Guarantee title (3-200 characters)
                            example: Correlation In Progress Issues with New Branch
                        description:
                            type: string
                            description: Guarantee description (max 500 characters)
                            example: 'TPa - When an issue is moved to In Progress, a branch associated with this issue must be created. (by Team, Hourly)'
                        example:
                            type: string
                            description: Usage example (max 500 characters)
                            example: 'If 4 out of 5 In Progress issues have an associated branch, the value is (4/5)*100 = 80%'
                numericExpression:
                    type: string
                    description: Mathematical expression referencing metric names. No spaces allowed. Operators allowed are +-/*().
                    maxLength: 500
                    example: (COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)
                comparator:
                    type: string
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                threshold:
                    type: number
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                window:
                    type: object
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0
                metrics:
                    type: array
                    description: Embedded metrics for this guarantee template
                    items:
                        $ref: '#/components/schemas/MetricEntry'

        MetricEntry:
            type: object
            description: A metric definition within a guarantee template
            required:
                - metricName
                - metricConfig
            properties:
                metricName:
                    type: string
                    description: Name of the metric (3-100 characters)
                    minLength: 3
                    maxLength: 100
                    example: COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES
                metricConfig:
                    type: object
                    required:
                        - event
                        - aggregation
                    properties:
                        event:
                            type: object
                            required:
                                - eventId
                                - fetcherConfigs
                            properties:
                                eventId:
                                    type: string
                                    description: Event ID registered in the computer
                                    example: EV_ZENHUB_ISSUES_BY_COLUMN_WITH_ASSOCIATED_BRANCHES
                                fetcherConfigs:
                                    type: array
                                    minItems: 1
                                    items:
                                        type: object
                                        required:
                                            - fetcherId
                                        properties:
                                            fetcherId:
                                                type: string
                                                description: Fetcher ID registered in the collector
                                                example: FT_GQL_ZENHUB_ISSUES
                                            fetcherConfig:
                                                type: object
                                                nullable: true
                                                description: Fetcher configuration. Null in templates (placeholder).
                                                example: null
                                processConfig:
                                    type: object
                                    nullable: true
                                    description: Process configuration. Null in templates (placeholder).
                                    example: null
                        aggregation:
                            type: object
                            required:
                                - aggregatorType
                                - aggregatorConfig
                            properties:
                                aggregatorType:
                                    type: string
                                    description: Aggregator type registered in the computer
                                    example: count
                                aggregatorConfig:
                                    type: object
                                    description: Aggregator configuration
                                    example: {}

        GuaranteeTemplateCreateInput:
            type: object
            description: |
                Payload for creating a guarantee template.
                Fields comparator, threshold and window must be explicitly set to null.
                The numericExpression must reference exactly the metrics in metrics.
            required:
                - name
                - info
                - numericExpression
                - comparator
                - threshold
                - window
                - metrics
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                info:
                    type: object
                    required:
                        - title
                        - description
                        - example
                    properties:
                        title:
                            type: string
                            minLength: 3
                            maxLength: 200
                            example: Correlation In Progress Issues with New Branch
                        description:
                            type: string
                            maxLength: 500
                            example: 'TPa - When an issue is moved to In Progress, a branch associated with this issue must be created. (by Team, Hourly)'
                        example:
                            type: string
                            maxLength: 500
                            example: 'If 4 out of 5 In Progress issues have an associated branch, the value is (4/5)*100 = 80%'
                numericExpression:
                    type: string
                    maxLength: 500
                    example: (COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)
                comparator:
                    type: string
                    nullable: true
                    enum: [null]
                    example: null
                threshold:
                    type: number
                    nullable: true
                    enum: [null]
                    example: null
                window:
                    type: object
                    nullable: true
                    enum: [null]
                    example: null
                metrics:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/MetricEntry'

        SignatureMetricEntry:
            type: object
            description: A metric entry within a signature, with full configuration
            required:
                - metricName
                - fetcherConfigs
                - processConfig
            properties:
                metricName:
                    type: string
                    description: Name of the metric (must match a metric in the guarantee template)
                    example: COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES
                fetcherConfigs:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required:
                            - fetcherId
                            - fetcherConfig
                        properties:
                            fetcherId:
                                type: string
                                example: FT_GQL_ZENHUB_ISSUES
                            fetcherConfig:
                                type: object
                                description: Full fetcher configuration (credentials, repository, etc.)
                                example:
                                    owner: universidad-sevilla
                                    repository: L1-01-project
                                    token: YOUR_GITHUB_TOKEN
                processConfig:
                    type: object
                    description: Full process configuration (member, status, etc.)
                    example:
                        columns:
                            - In Progress

        # ── AgreementCollection ──────────────────────
        AgreementCollection:
            type: object
            description: |
                An agreement collection groups multiple agreement versions for an element.
                Only one version can be auditable at a time, tracked by `auditableVersionNumber`.
            required:
                - _id
                - name
                - elementId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 69cbe9901d5009a04361925d
                name:
                    type: string
                    description: Collection name, unique within the element. Only letters, numbers, hyphens and underscores.
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: tpa-US-PSG2-2526
                displayName:
                    type: string
                    description: Human-readable display name (max 200 characters)
                    maxLength: 200
                    example: TPA US PSG2 2526
                elementId:
                    type: string
                    description: ObjectId of the element this collection belongs to
                    example: 69cbdee759092b362376ca17
                auditableVersionNumber:
                    type: integer
                    nullable: true
                    description: Version number of the currently auditable version, or null if none
                    example: 1
                agreementVersions:
                    type: array
                    description: Embedded agreement versions
                    items:
                        $ref: '#/components/schemas/AgreementVersionRaw'
                fields:
                    type: array
                    description: Collection fields
                    items:
                        type: object
                permissions:
                    type: array
                    description: Collection permissions
                    items:
                        type: object
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        AgreementCollectionInput:
            type: object
            description: Payload for creating an agreement collection
            required:
                - name
                - displayName
                - fields
                - permissions
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: tpa-US-PSG2-2526
                displayName:
                    type: string
                    maxLength: 200
                    example: TPA US PSG2 2526
                fields:
                    type: array
                    items:
                        type: object
                permissions:
                    type: array
                    items:
                        type: object

        AgreementCollectionUpdateInput:
            type: object
            description: Payload for updating an agreement collection
            required:
                - name
                - displayName
                - fields
                - permissions
                - auditableVersionNumber
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: tpa-US-PSG2-2526
                displayName:
                    type: string
                    maxLength: 200
                    example: TPA US PSG2 2526 (actualizado)
                fields:
                    type: array
                    items:
                        type: object
                permissions:
                    type: array
                    items:
                        type: object
                auditableVersionNumber:
                    type: integer
                    nullable: true
                    description: Version number to set as auditable, or null to unset
                    example: null

        # ── AgreementVersion ──────────────────────
        AgreementVersionRaw:
            type: object
            description: Raw agreement version as stored in the database (with ObjectId references)
            properties:
                versionNumber:
                    type: integer
                    description: Auto-incremented version number
                    example: 1
                contract:
                    type: object
                    properties:
                        validity:
                            type: object
                            properties:
                                timezone:
                                    type: string
                                    description: IANA timezone
                                    example: America/Los_Angeles
                                initial:
                                    type: string
                                    format: date-time
                                    example: '2024-01-01T00:00:00.000Z'
                                end:
                                    type: string
                                    format: date-time
                                    example: '2024-12-31T23:59:59.000Z'
                                earlyTermination:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    description: Set when the version is terminated early
                                    example: null
                        agreementTemplateId:
                            type: string
                            description: ObjectId of the referenced agreement template
                            example: 69cbd30332c8b7152e9aa73a
                        signaturesId:
                            type: array
                            description: Array of Signature ObjectId references
                            items:
                                type: string
                            example:
                                - 69cbea571d5009a043619276
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        AgreementVersionExpanded:
            type: object
            description: Assembled agreement version with resolved signatures, guarantees and metric configurations
            properties:
                versionNumber:
                    type: integer
                    example: 1
                contract:
                    type: object
                    properties:
                        agreementTemplateName:
                            type: string
                            description: Resolved name of the agreement template
                            example: tpa-US-PSG2-2526
                        validity:
                            type: object
                            properties:
                                timezone:
                                    type: string
                                    example: America/Los_Angeles
                                initial:
                                    type: string
                                    format: date-time
                                    example: '2024-01-01T00:00:00.000Z'
                                end:
                                    type: string
                                    format: date-time
                                    example: '2024-12-31T23:59:59.000Z'
                                earlyTermination:
                                    type: string
                                    format: date-time
                                    nullable: true
                                    example: null
                        signatures:
                            type: array
                            items:
                                $ref: '#/components/schemas/ExpandedSignature'

        ExpandedSignature:
            type: object
            description: A fully assembled signature with guarantee and metric data
            properties:
                signatureId:
                    type: string
                    description: ObjectId of the signature
                    example: 69cbea571d5009a043619276
                guarantee:
                    type: object
                    properties:
                        name:
                            type: string
                            description: Guarantee template name
                            example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                        numericExpression:
                            type: string
                            description: Numeric expression from the guarantee template
                            example: (COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)
                        comparator:
                            type: string
                            enum: ['<', '>', '<=', '>=', '==', '!=']
                            example: '>='
                        threshold:
                            type: number
                            example: 75
                        window:
                            type: object
                            properties:
                                period:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            unit:
                                                type: string
                                                enum: [millisecond, second, minute, hour, day, week]
                                                example: hour
                                            value:
                                                type: integer
                                                example: 1
                                anchorDate:
                                    type: string
                                    format: date-time
                                    example: '2024-01-01T00:00:00.000Z'
                        metrics:
                            type: array
                            description: Metrics from the guarantee template
                            items:
                                $ref: '#/components/schemas/MetricEntry'
                metrics:
                    type: array
                    description: Signature metrics with full fetcher and process configuration
                    items:
                        $ref: '#/components/schemas/SignatureMetricEntry'

        AgreementVersionInput:
            type: object
            description: |
                Payload for creating an agreement version.
                Each signature references an existing guarantee template by name.
            required:
                - contract
                - signatures
            properties:
                contract:
                    type: object
                    required:
                        - agreementTemplateName
                        - validity
                    properties:
                        agreementTemplateName:
                            type: string
                            description: Name of an existing agreement template in the organization
                            minLength: 3
                            maxLength: 100
                            example: tpa-US-PSG2-2526
                        validity:
                            type: object
                            required:
                                - timezone
                                - initial
                                - end
                            properties:
                                timezone:
                                    type: string
                                    description: Valid IANA timezone
                                    example: America/Los_Angeles
                                initial:
                                    type: string
                                    format: date-time
                                    description: Start date (ISO8601). Must be before `end`.
                                    example: '2024-01-01T00:00:00.000Z'
                                end:
                                    type: string
                                    format: date-time
                                    description: End date (ISO8601). Must be after `initial`.
                                    example: '2024-12-31T23:59:59.000Z'
                signatures:
                    type: array
                    description: At least one signature is required
                    minItems: 1
                    items:
                        type: object
                        required:
                            - guaranteeName
                            - metrics
                        properties:
                            guaranteeName:
                                type: string
                                description: Name of an existing guarantee template
                                minLength: 3
                                maxLength: 100
                                example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                            metrics:
                                type: array
                                description: Metrics with full fetcher and process configuration
                                minItems: 1
                                items:
                                    $ref: '#/components/schemas/SignatureMetricEntry'

        GuaranteeTemplateUpdateInput:
            type: object
            description: |
                Payload for updating a guarantee template. Only modifiable fields are required.
                Fields comparator, threshold and window are silently ignored if sent.
            required:
                - name
                - info
                - numericExpression
                - metrics
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                info:
                    type: object
                    required:
                        - title
                        - description
                        - example
                    properties:
                        title:
                            type: string
                            minLength: 3
                            maxLength: 200
                            example: Updated Title
                        description:
                            type: string
                            maxLength: 500
                            example: Updated description.
                        example:
                            type: string
                            maxLength: 500
                            example: Updated example.
                numericExpression:
                    type: string
                    maxLength: 500
                    example: (COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)
                metrics:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/MetricEntry'

openapi: 3.0.0
info:
    title: Registry API
    version: 1.0.0
    description: |
        REST API for managing organizations, their roles, element fields
        and agreement fields within Registry API.

        Each organization is the main container in the system: it groups elements,
        defines the vocabulary they must follow and establishes the available roles.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: Users
      description: User management
    - name: Organizations
      description: Organization management
    - name: Roles
      description: Role management within an organization
    - name: ElementFields
      description: Fields that define the structure of an organization's elements
    - name: AgreementFields
      description: Fields that define the structure of an organization's agreements
    - name: Members
      description: Member management within an organization
    - name: GuaranteeTemplates
      description: Guarantee template management

paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string

    # ──────────────────────────────────────────────
    # Users
    # ──────────────────────────────────────────────
    /api/v1/users:
        get:
            tags:
                - Users
            summary: List all users
            operationId: getUsers
            security:
                - BearerAuth: []
            description: |
                Returns an array with all users in the system.
                Requires admin role to access.
            responses:
                '200':
                    description: A list of users
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - Users
            summary: Create a new user
            operationId: createUser
            description: |
                Creates a new user with the provided credentials.
                Requires admin role to create users.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserInput'
            responses:
                '201':
                    description: User created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/{username}:
        parameters:
            - in: path
              name: username
              required: true
              schema:
                  type: string
              description: Username of the user
              example: johndoe
        get:
            tags:
                - Users
            summary: Get user by username
            operationId: getUserByUsername
            security:
                - BearerAuth: []
            description: |
                Returns a specific user by their username.
                Requires admin role to access.
            responses:
                '200':
                    description: User found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - Users
            summary: Update user by username
            operationId: updateUser
            security:
                - BearerAuth: []
            description: |
                Updates an existing user's information.
                Requires admin role to update users.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserInput'
            responses:
                '200':
                    description: User updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Users
            summary: Delete user by username
            operationId: deleteUser
            security:
                - BearerAuth: []
            description: |
                Deletes a user from the system.
                Requires admin role to delete users.
            responses:
                '200':
                    description: User deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/login:
        post:
            tags:
                - Users
            summary: User login
            operationId: login
            description: |
                Authenticates a user using their login credentials (username or email) and password.
                Returns a JWT token upon successful authentication.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginInput'
            responses:
                '200':
                    description: Login successful. Returns a JWT token.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: string
                                              description: JWT authentication token
                                              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Organizations
    # ──────────────────────────────────────────────
    /api/v1/organizations:
        get:
            tags:
                - Organizations
            summary: List all organizations
            operationId: getOrganizations
            security:
                - BearerAuth: []
            description: |
                Returns an array with all organizations registered in the system.
                Each organization includes its roles, element fields and agreement fields.
            responses:
                '200':
                    description: List of organizations retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Organization'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665a1b2c3d4e5f6a7b8c9d0e
                                      name: universidad-sevilla
                                      displayName: Universidad de Sevilla
                                      description: Organization for Universidad de Sevilla
                                      elementFields: []
                                      agreementFields: []
                                      roles:
                                          - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                            name: admin
                                            description: Organization Administrator
                                      createdAt: '2025-06-01T10:00:00.000Z'
                                      updatedAt: '2025-06-01T10:00:00.000Z'
                                      __v: 0
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - Organizations
            summary: Create an organization
            operationId: createOrganization
            security:
                - BearerAuth: []
            description: |
                Creates a new organization with a unique name and a description.
                Requires system ADMIN role. The organization is created with a default
                'admin' role and the creator is automatically assigned as admin.
                The elementFields and agreementFields arrays are initialized empty.
            requestBody:
                $ref: '#/components/requestBodies/OrganizationBody'
            responses:
                '201':
                    description: Organization created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                            example:
                                success: true
                                message: Organization created
                                httpStatus: 201
                                appCode: SUCCESS
                                data:
                                    _id: 665a1b2c3d4e5f6a7b8c9d0e
                                    name: universidad-sevilla
                                    displayName: Universidad de Sevilla
                                    description: Organization for Universidad de Sevilla
                                    elementFields: []
                                    agreementFields: []
                                    roles:
                                        - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                          name: admin
                                          description: Organization Administrator
                                    createdAt: '2025-06-01T10:00:00.000Z'
                                    updatedAt: '2025-06-01T10:00:00.000Z'
                                    __v: 0
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/OrganizationConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - Organizations
            summary: Get an organization by name
            operationId: getOrganizationByName
            security:
                - BearerAuth: []
            description: |
                Returns the full organization identified by its unique name,
                including its roles, element fields and agreement fields.
            responses:
                '200':
                    description: Organization found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - Organizations
            summary: Update an organization
            operationId: updateOrganization
            security:
                - BearerAuth: []
            description: |
                Updates the name and/or description of an existing organization.
                Requires organization admin role.
                If the name is changed, the new name must be unique in the system.
            requestBody:
                $ref: '#/components/requestBodies/OrganizationBody'
            responses:
                '200':
                    description: Organization updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/OrganizationConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Organizations
            summary: Delete an organization
            operationId: deleteOrganization
            security:
                - BearerAuth: []
            description: |
                Permanently deletes the organization and all its associated data.
                Requires organization admin role.
            responses:
                '200':
                    description: Organization deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                            example:
                                success: true
                                message: Organization deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Roles
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/roles:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - Roles
            summary: Add a role to the organization
            operationId: addRole
            security:
                - BearerAuth: []
            description: |
                Adds a new role to the specified organization.
                Requires organization admin role.
                The role name must be unique within the organization.
                There is a maximum role limit per organization (default 100).
            requestBody:
                $ref: '#/components/requestBodies/RoleBody'
            responses:
                '201':
                    description: Role added successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/RoleConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/roles/{roleName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/roleName'
        put:
            tags:
                - Roles
            summary: Update a role
            operationId: updateRole
            security:
                - BearerAuth: []
            description: |
                Updates the name and/or description of an existing role.
                Requires organization admin role.
                The built-in 'admin' role cannot be modified.
                If the name is changed, the new name must be unique within the organization.
            requestBody:
                $ref: '#/components/requestBodies/RoleBody'
            responses:
                '200':
                    description: Role updated successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/RoleNotFound'
                '409':
                    $ref: '#/components/responses/RoleConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Roles
            summary: Delete a role
            operationId: deleteRole
            security:
                - BearerAuth: []
            description: |
                Removes a role from the organization. Requires organization admin role.
                The built-in 'admin' role cannot be deleted.
                This operation also cascade-deletes all references to this role
                in the associated user memberships.
            responses:
                '200':
                    description: Role deleted successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/RoleNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Element Fields
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/elementFields:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - ElementFields
            summary: Add an element field
            operationId: addElementField
            security:
                - BearerAuth: []
            description: |
                Adds a new field to the organization's element definition.
                Requires organization admin role.
                This field becomes part of the structure that elements belonging
                to this organization must follow.
            requestBody:
                $ref: '#/components/requestBodies/FieldBody'
            responses:
                '201':
                    description: Element field added. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/ElementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/elementFields/{fieldName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/elementFieldName'
        put:
            tags:
                - ElementFields
            summary: Update an element field
            operationId: updateElementField
            security:
                - BearerAuth: []
            description: |
                Updates an existing element field. Requires organization admin role.
                If the name is changed, the new name must be unique within the
                organization's elementFields.
            requestBody:
                $ref: '#/components/requestBodies/FieldBody'
            responses:
                '200':
                    description: Element field updated. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ElementFieldNotFound'
                '409':
                    $ref: '#/components/responses/ElementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - ElementFields
            summary: Delete an element field
            operationId: deleteElementField
            security:
                - BearerAuth: []
            description: |
                Removes a field from the organization's element definition.
                Requires organization admin role.
            responses:
                '200':
                    description: Element field deleted. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ElementFieldNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Agreement Fields
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/agreementFields:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - AgreementFields
            summary: Add an agreement field
            operationId: addAgreementField
            security:
                - BearerAuth: []
            description: |
                Adds a new field to the organization's agreement definition.
                Requires organization admin role.
                This field becomes part of the structure that agreements associated
                with this organization's elements must follow.
            requestBody:
                $ref: '#/components/requestBodies/AgreementFieldBody'
            responses:
                '201':
                    description: Agreement field added. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/AgreementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/agreementFields/{fieldName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/agreementFieldName'
        put:
            tags:
                - AgreementFields
            summary: Update an agreement field
            operationId: updateAgreementField
            security:
                - BearerAuth: []
            description: |
                Updates an existing agreement field. Requires organization admin role.
                If the name is changed, the new name must be unique within the
                organization's agreementFields.
            requestBody:
                $ref: '#/components/requestBodies/AgreementFieldBody'
            responses:
                '200':
                    description: Agreement field updated. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/AgreementFieldNotFound'
                '409':
                    $ref: '#/components/responses/AgreementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - AgreementFields
            summary: Delete an agreement field
            operationId: deleteAgreementField
            security:
                - BearerAuth: []
            description: |
                Removes a field from the organization's agreement definition.
                Requires organization admin role.
            responses:
                '200':
                    description: Agreement field deleted. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Organization'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/AgreementFieldNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Members
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/members:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - Members
            summary: List members of an organization
            operationId: getMembers
            security:
                - BearerAuth: []
            description: |
                Returns the memberships of the specified organization.
                Requires organization admin role.
                Use the `expand` query parameter to control the level of detail:
                - `none` (default): returns raw ObjectIds

                - `full`: populates user, organization and role objects

                - `names`: populates only user username, organization name and role names
            parameters:
                - in: query
                  name: expand
                  required: false
                  description: Level of detail for the returned memberships
                  schema:
                      type: string
                      default: none
                      enum: [none, full, names]
            responses:
                '200':
                    description: List of members retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Membership'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':

    # ── Schemas ───────────────────────────────────
    schemas:
        # ── Standard response ────────────────────
        SuccessResponse:
            type: object
            description: Standard wrapper for all successful API responses
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        ErrorResponse:
            type: object
            description: Standard wrapper for all error API responses
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            description: Additional error information (may be null)
                            type: object
                            nullable: true
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        # ── Organization ─────────────────────────
        Organization:
            type: object
            description: |
                Main container of the system. Defines the structure of its elements,
                the structure of its agreements and the available roles.
            required:
                - _id
                - name
                - description
                - elementFields
                - agreementFields
                - roles
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                name:
                    type: string
                    description: Unique organization name (used as identifier in the API). Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters. Defaults to empty string.
                    maxLength: 200
                    default: ''
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla
                elementFields:
                    type: array
                    description: Fields that define the structure of elements
                    items:
                        $ref: '#/components/schemas/ElementField'
                agreementFields:
                    type: array
                    description: Fields that define the structure of agreements
                    items:
                        $ref: '#/components/schemas/AgreementField'
                roles:
                    type: array
                    description: Available roles within the organization
                    items:
                        $ref: '#/components/schemas/Role'
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        OrganizationInput:
            type: object
            description: Data required to create or update an organization
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Unique organization name. Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters.
                    maxLength: 200
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla

        # ── Role ─────────────────────────────────
        Role:
            type: object
            description: Role within an organization (e.g. admin, teacher, student)
            required:
                - _id
                - name
                - description
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (subdocument ObjectId)
                    example: 665b2c3d4e5f6a7b8c9d0e1f
                name:
                    type: string
                    description: Role name (unique within the organization)
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    maxLength: 500
                    example: Organization administrator

        RoleInput:
            type: object
            description: Data required to create or update a role
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Role name (unique within the organization)
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    maxLength: 500
                    example: Organization administrator

        # ── Membership ──────────────────────────
        Membership:
            type: object
            description: Represents the relationship between a user and an organization
            required:
                - _id
                - organizationId
                - userId
                - rolesId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c3d4e5f6a7b8c9d0e1f2a
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                userId:
                    type: string
                    description: User ObjectId reference
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                rolesId:
                    type: array
                    description: Array of Role ObjectId references assigned to the user
                    items:
                        type: string
                    example: []
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        MemberInput:
            type: object
            description: Data required to add a user to an organization
            required:
                - username
            properties:
                username:
                    type: string
                    description: Username of the user to add
                    example: johndoe

        # ── Base field properties (shared) ──────
        FieldBase:
            type: object
            required:
                - name
                - description
                - type
            properties:
                name:
                    type: string
                    description: Field name (unique within its array)
                    maxLength: 100
                description:
                    type: string
                    description: Field description
                    maxLength: 500
                type:
                    type: string
                    description: Field type
                    enum:
                        - string
                        - enum
                        - number

        # ── ElementField ─────────────────────────
        ElementField:
            description: |
                Field that defines part of the structure of an organization's elements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string

        ElementFieldInput:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string

        # ── AgreementField ──────────────────────
        AgreementField:
            description: |
                Field that defines part of the structure of an organization's agreements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        AgreementFieldInput:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        # ── User ─────────────────────
        User:
            type: object
            description: Represents a user in the system
            required:
                - _id
                - username
                - email
                - name
                - surname
                - systemRole
            properties:
                _id:
                    type: string
                    description: MongoDB ObjectId
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                username:
                    type: string
                    description: Unique username (3-50 characters)
                    minLength: 3
                    maxLength: 50
                    example: johndoe
                email:
                    type: string
                    format: email
                    description: User email address
                    example: john@example.com
                name:
                    type: string
                    description: User's first name (2-30 characters)
                    minLength: 2
                    maxLength: 30
                    example: John
                surname:
                    type: string
                    description: User's last name (2-50 characters)
                    minLength: 2
                    maxLength: 50
                    example: Doe
                systemRole:
                    type: string
                    description: System-level role
                    enum: [ADMIN, USER]
                    example: ADMIN
                createdAt:
                    type: string
                    format: date-time
                    example: '2025-06-01T12:00:00.000Z'
                updatedAt:
                    type: string
                    format: date-time
                    example: '2025-06-01T12:00:00.000Z'

        UserInput:
            type: object
            description: Request payload for creating or updating a user
            required:
                - username
                - email
                - password
                - name
                - surname
                - systemRole
            properties:
                username:
                    type: string
                    description: Unique username (3-50 characters)
                    minLength: 3
                    maxLength: 50
                    example: johndoe
                email:
                    type: string
                    format: email
                    description: Valid email address
                    example: john@example.com
                password:
                    type: string
                    description: Password (minimum 6 characters)
                    minLength: 6
                    example: securePassword123
                name:
                    type: string
                    description: User's first name (2-30 characters)
                    minLength: 2
                    maxLength: 30
                    example: John
                surname:
                    type: string
                    description: User's last name (2-50 characters)
                    minLength: 2
                    maxLength: 50
                    example: Doe
                systemRole:
                    type: string
                    description: System-level role
                    enum: [ADMIN, USER]
                    example: USER

        LoginInput:
            type: object
            description: Request payload for user login
            required:
                - login
                - password
            properties:
                login:
                    type: string
                    description: Login identifier - can be username or email (3-100 characters)
                    minLength: 3
                    maxLength: 100
                    example: johndoe
                password:
                    type: string
                    description: User password (minimum 6 characters)
                    minLength: 6
                    example: securePassword123

        # ── GuaranteeTemplate ──────────────────────
        GuaranteeTemplate:
            type: object
            description: |
                Theoretical definition of a guarantee condition. By itself it has no specific
                objective — the comparator, threshold and window are injected by the
                AgreementTemplate when it references this template.
            required:
                - _id
                - name
                - info
                - numericExpression
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665e5f6a7b8c9d0e1f2a3b4c
                name:
                    type: string
                    description: Unique template name. Only letters, numbers, hyphens and underscores.
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                info:
                    type: object
                    description: Human-readable information about the guarantee
                    required:
                        - title
                    properties:
                        title:
                            type: string
                            description: Guarantee title (3-200 characters)
                            example: Number of Commits by Team
                        description:
                            type: string
                            description: Guarantee description (max 500 characters)
                            example: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                        example:
                            type: string
                            description: Usage example (max 500 characters)
                            example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                numericExpression:
                    type: string
                    description: Mathematical expression referencing metric names. No spaces allowed. Operators allowed are +-/*().
                    maxLength: 500
                    example: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                comparator:
                    type: string
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                threshold:
                    type: number
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                window:
                    type: object
                    nullable: true
                    description: Always null in the template. Injected by AgreementTemplate.
                    example: null
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0
                metricsConfig:
                    type: array
                    description: Metric configurations associated with this template (assembled from MetricConfig documents)
                    items:
                        $ref: '#/components/schemas/IMetricConfigEntry'

        IMetricConfigEntry:
            type: object
            description: A metric configuration entry within a guarantee template
            required:
                - name
                - config
            properties:
                name:
                    type: string
                    description: Name of the referenced metric (3-100 characters)
                    minLength: 3
                    maxLength: 100
                    example: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                config:
                    type: object
                    description: Configuration for this metric. Can be empty ({}) if the metric requires no configuration.
                    example: {}

        GuaranteeTemplateCreateInput:
            type: object
            description: |
                Payload for creating a guarantee template.
                Fields comparator, threshold and window must be explicitly set to null.
                The numericExpression must reference exactly the metrics in metricsConfig.
            required:
                - name
                - info
                - numericExpression
                - comparator
                - threshold
                - window
                - metricsConfig
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                info:
                    type: object
                    required:
                        - title
                        - description
                        - example
                    properties:
                        title:
                            type: string
                            minLength: 3
                            maxLength: 200
                            example: Number of Commits by Team
                        description:
                            type: string
                            maxLength: 500
                            example: This guarantee measures the total number of commits made to a specific repository by the entire team over a defined period.
                        example:
                            type: string
                            maxLength: 500
                            example: If a team has made 150 commits to the repository over the last month, this number reflects the team's overall contribution.
                numericExpression:
                    type: string
                    maxLength: 500
                    example: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                comparator:
                    type: string
                    nullable: true
                    enum: [null]
                    example: null
                threshold:
                    type: number
                    nullable: true
                    enum: [null]
                    example: null
                window:
                    type: object
                    nullable: true
                    enum: [null]
                    example: null
                metricsConfig:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/IMetricConfigEntry'

        GuaranteeTemplateUpdateInput:
            type: object
            description: |
                Payload for updating a guarantee template. Only modifiable fields are required.
                Fields comparator, threshold and window are silently ignored if sent.
            required:
                - name
                - info
                - numericExpression
                - metricsConfig
            properties:
                name:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                    minLength: 3
                    maxLength: 100
                    example: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
                info:
                    type: object
                    required:
                        - title
                        - description
                        - example
                    properties:
                        title:
                            type: string
                            minLength: 3
                            maxLength: 200
                            example: Updated Title
                        description:
                            type: string
                            maxLength: 500
                            example: Updated description.
                        example:
                            type: string
                            maxLength: 500
                            example: Updated example.
                numericExpression:
                    type: string
                    maxLength: 500
                    example: MT_ELEMENT_xx_GITHUB_xx_COUNT_COMMITS
                metricsConfig:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/IMetricConfigEntry'

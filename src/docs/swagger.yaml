openapi: 3.0.0
info:
    title: Registry API
    version: 1.0.0
    description: |
        REST API for managing organizations, their roles, element fields
        and agreement fields within Registry API.

        Each organization is the main container in the system: it groups elements,
        defines the vocabulary they must follow and establishes the available roles.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: GuaranteeTemplates
      description: Guarantee template management
    - name: AgreementTemplates
      description: Agreement template management within an organization
    - name: AgreementCollections
      description: Agreement collection management within an element
    - name: AgreementVersions
      description: Agreement version management within a collection
    - name: Fetchers
      description: Fetch result orchestration from Registry

paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string

    # ──────────────────────────────────────────────
    # GuaranteeTemplates
    # ──────────────────────────────────────────────
    /api/v1/guaranteeTemplates:
        get:
            tags:
                - GuaranteeTemplates
            summary: List all guarantee templates
            operationId: getGuaranteeTemplates
            description: |
                Returns all guarantee templates in the system, each one with its
                embedded metrics array.
            responses:
                '200':
                    description: List of guarantee templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      name: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                      info:
                                          title: Correlation In Progress Issues with New Branch
                                          description: 'TPa - When an issue is moved to In Progress, a branch associated with this issue must be created. (by Team, Hourly)'
                                          example: 'If 4 out of 5 In Progress issues have an associated branch, the value is (4/5)*100 = 80%'
                                      numericExpression: '(COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)'
                                      comparator: null
                                      threshold: null
                                      window: null
                                      __v: 0
                                      metrics:
                                          - metricName: COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES
                                            metricConfig:
                                                event:
                                                    eventId: EV_ZENHUB_ISSUES_BY_COLUMN_WITH_ASSOCIATED_BRANCHES
                                                    fetcherConfigs:
                                                        - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                          fetcherConfig: null
                                                        - fetcherId: FT_GQL_GITHUB_ISSUES
                                                          fetcherConfig: null
                                                    processConfig: null
                                                aggregation:
                                                    aggregatorType: count
                                                    aggregatorConfig: {}
                                          - metricName: COUNT_INPROGRESS_ISSUES
                                            metricConfig:
                                                event:
                                                    eventId: EV_ZENHUB_ISSUES_BY_COLUMN
                                                    fetcherConfigs:
                                                        - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                          fetcherConfig: null
                                                    processConfig: null
                                                aggregation:
                                                    aggregatorType: count
                                                    aggregatorConfig: {}
                                error: null
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - GuaranteeTemplates
            summary: Create a guarantee template
            operationId: createGuaranteeTemplate
            description: |
                Creates a new guarantee template with embedded metrics.
                The fields `comparator`, `threshold` and `window` must be explicitly set to `null`,
                as these values are injected later by the AgreementTemplate.
                The `numericExpression` must be a valid mathematical expression referencing
                exactly the metrics declared in `metrics` (bidirectional consistency).
                Each metric's metricConfig eventId, fetcherId and aggregatorType are validated against the computer and collector.
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateBody'
            responses:
                '200':
                    description: Guarantee template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                    info:
                                        title: Correlation In Progress Issues with New Branch
                                        description: 'TPa - When an issue is moved to In Progress, a branch associated with this issue must be created. (by Team, Hourly)'
                                        example: 'If 4 out of 5 In Progress issues have an associated branch, the value is (4/5)*100 = 80%'
                                    numericExpression: '(COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)'
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metrics:
                                        - metricName: COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES
                                          metricConfig:
                                              event:
                                                  eventId: EV_ZENHUB_ISSUES_BY_COLUMN_WITH_ASSOCIATED_BRANCHES
                                                  fetcherConfigs:
                                                      - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                        fetcherConfig: null
                                                      - fetcherId: FT_GQL_GITHUB_ISSUES
                                                        fetcherConfig: null
                                                  processConfig: null
                                              aggregation:
                                                  aggregatorType: count
                                                  aggregatorConfig: {}
                                        - metricName: COUNT_INPROGRESS_ISSUES
                                          metricConfig:
                                              event:
                                                  eventId: EV_ZENHUB_ISSUES_BY_COLUMN
                                                  fetcherConfigs:
                                                      - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                        fetcherConfig: null
                                                  processConfig: null
                                              aggregation:
                                                  aggregatorType: count
                                                  aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/guaranteeTemplates/{guaranteeName}:
        parameters:
            - $ref: '#/components/parameters/guaranteeName'
        get:
            tags:
                - GuaranteeTemplates
            summary: Get a guarantee template by name
            operationId: getGuaranteeTemplate
            description: |
                Returns a specific guarantee template identified by its unique name,
                with its embedded metrics array.
            responses:
                '200':
                    description: Guarantee template found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - GuaranteeTemplates
            summary: Update a guarantee template
            operationId: updateGuaranteeTemplate
            description: |
                Updates an existing guarantee template. All modifiable fields must be sent
                in the body: `name`, `info`, `numericExpression` and `metrics`.
                Fields `comparator`, `threshold` and `window` are not modifiable and are
                silently ignored if sent.
                If the `name` changes, the new name must be unique in the system.
            requestBody:
                $ref: '#/components/requestBodies/GuaranteeTemplateUpdateBody'
            responses:
                '200':
                    description: Guarantee template updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/GuaranteeTemplate'
                            example:
                                success: true
                                message: Guarantee template updated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665e5f6a7b8c9d0e1f2a3b4c
                                    name: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                    info:
                                        title: Updated Title
                                        description: Updated description.
                                        example: Updated example.
                                    numericExpression: '(COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)'
                                    comparator: null
                                    threshold: null
                                    window: null
                                    __v: 0
                                    metrics:
                                        - metricName: COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES
                                          metricConfig:
                                              event:
                                                  eventId: EV_ZENHUB_ISSUES_BY_COLUMN_WITH_ASSOCIATED_BRANCHES
                                                  fetcherConfigs:
                                                      - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                        fetcherConfig: null
                                                      - fetcherId: FT_GQL_GITHUB_ISSUES
                                                        fetcherConfig: null
                                                  processConfig: null
                                              aggregation:
                                                  aggregatorType: count
                                                  aggregatorConfig: {}
                                        - metricName: COUNT_INPROGRESS_ISSUES
                                          metricConfig:
                                              event:
                                                  eventId: EV_ZENHUB_ISSUES_BY_COLUMN
                                                  fetcherConfigs:
                                                      - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                        fetcherConfig: null
                                                  processConfig: null
                                              aggregation:
                                                  aggregatorType: count
                                                  aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '409':
                    $ref: '#/components/responses/GuaranteeTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - GuaranteeTemplates
            summary: Delete a guarantee template
            operationId: deleteGuaranteeTemplate
            description: |
                Permanently deletes a guarantee template.
            responses:
                '200':
                    description: Guarantee template deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                            example:
                                success: true
                                message: Guarantee template deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '400':
                    $ref: '#/components/responses/GuaranteeTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # AgreementTemplates
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/agreementTemplates:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:

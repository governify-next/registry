                                    agColId: 69cbe9901d5009a04361925d
                                    agreementVersion:
                                        versionNumber: 1
                                        contract:
                                            agreementTemplateName: tpa-US-PSG2-2526
                                            signatures:
                                                - signatureId: 69cbea571d5009a043619276
                                                  states:
                                                      - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                                        status: COMPLETED
                                                        complianceStatus: COMPLIANT
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/states/generate:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersionSelector'
        post:
            tags:
                - States
            summary: Generate states for a selected agreement version
            operationId: generateStatesForAgreementVersion
            description: |
                Generates one state per selected signature in the agreement version selected by
                the path parameter. A numeric selector is one-based: `1` selects
                `agreementVersions[0]`, `2` selects `agreementVersions[1]`, and so on.
                `auditableVersion` resolves the collection's current auditable version.
                The request `date` is propagated as `temporalContext.effectiveAt` to Computer and
                Fetcher for every metric.

                **Temporal acquisition**

                Stored fetch results are identified by the exact effective date and fetcher
                configuration. An existing result is reused in either mode. On a cache miss, or
                when an existing result is `FAILED`, acquisition behaves as follows:

                | `temporalMode` | `SNAPSHOT` fetcher | `HISTORICAL` fetcher |
                | --- | --- | --- |
                | `CAPTURE` | Calls the external source and stores the observation for the exact requested date. | Calls the external source for the requested date and stores the result. |
                | `REPLAY` | Never calls the external source. Produces `UNAVAILABLE` with reason `PAST_SNAPSHOT_NOT_CAPTURED` when no reusable result exists. | Calls the historical source for the requested date and stores the result. |

                `CAPTURE` is intended to run at the exact instant represented by `date` when a
                snapshot source is involved. Registry propagates the date but does not compare it
                with the current wall-clock time.

                **Computer result to stored state**

                Each Computer call resolves a single metric. Registry stores the returned metric
                status and then evaluates the guarantee using all its metrics:

                | Computer outcome | Stored metric | Effect on the state |
                | --- | --- | --- |
                | HTTP success with `status: COMPUTED` | `COMPUTED`, with `value` and evidences | The metric can be used in the numeric expression. |
                | HTTP success with `status: UNAVAILABLE` | `UNAVAILABLE`, `value: null` | If no metric failed, state is `COMPLETED` with `complianceStatus: INDETERMINATE`. |
                | HTTP success with `status: FAILED` | `FAILED`, `value: null` | State is `FAILED` with `complianceStatus: INDETERMINATE`. |
                | Computer cannot be reached or returns a non-success response | Registry stores that metric as `FAILED` with `errorMessage` | State is `FAILED` with `complianceStatus: INDETERMINATE`; the per-metric Computer error is represented in the state instead of being returned as the endpoint HTTP error. |

                Therefore a state is `COMPLETED` and determinate only when every metric is
                `COMPUTED` and the numeric expression produces a finite value. `UNAVAILABLE` is a
                domain outcome, not an execution failure, so it produces a `COMPLETED` state with
                `complianceStatus: INDETERMINATE`. A `FAILED` metric takes precedence over unavailable metrics.

                **Existing-state and execution policies**

                - `KEEP`: if the `(signatureId, date)` state already exists, it is returned exactly
                  as stored and neither Computer nor Fetcher is called. Otherwise it is generated.
                - `REPLACE`: the existing document is reinitialized and recomputed with the requested
                  temporal mode; its replacement attempt is incremented.
                - `isAsync=false`: waits for computation and returns HTTP `207` when at least one
                  returned state has `complianceStatus: INDETERMINATE`; otherwise returns HTTP `200`.
                - `isAsync=true`: returns the claimed states immediately, normally as `IN_PROGRESS`
                  with `PENDING` metrics, using HTTP `200`. Final results are persisted in the background.

                When `signatureIds` is omitted, every signature is processed. When supplied,
                only those signatures are processed. The array must be non-empty, contain unique
                ObjectIds, and every identifier must belong to the selected agreement version.
                The complete selection is validated before any state generation begins. Selected
                identifiers are filtered before assembly, so unrelated signatures, guarantees and
                metric configurations are not loaded.
            parameters:
                - in: query
                  name: isAsync
                  required: false
                  schema:
                      type: boolean
                      default: false
                  description: If true, states are created and metric computation continues asynchronously.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - date
                                - temporalMode
                                - ifExists
                            properties:
                                date:
                                    type: string
                                    format: date-time
                                    description: Date at which every signature guarantee is evaluated.
                                temporalMode:
                                    type: string
                                    enum: [CAPTURE, REPLAY]
                                    description: |
                                        Temporal acquisition policy propagated to Computer and Fetcher.
                                        `CAPTURE` permits external acquisition for snapshot and historical
                                        fetchers. `REPLAY` forbids external acquisition only for snapshot
                                        fetchers; historical fetchers may still query their source.
                                ifExists:
                                    type: string
                                    enum: [KEEP, REPLACE]
                                    description: |
                                        Existing-state policy for the `(signatureId, date)` key. `KEEP`
                                        returns an existing state without recomputation. `REPLACE`
                                        reinitializes and recomputes the same document.
                                signatureIds:
                                    type: array
                                    minItems: 1
                                    uniqueItems: true
                                    description: Optional subset of agreement signature ObjectIds. Omit to generate every signature.
                                    items:
                                        type: string
                                        pattern: '^[a-fA-F0-9]{24}$'
                                        example: 69cbea571d5009a043619276
                        example:
                            date: '2026-05-21T00:00:00.000Z'
                            temporalMode: REPLAY
                            ifExists: REPLACE
                            signatureIds:
                                - 69cbea571d5009a043619276
                                - 69cbea571d5009a043619277
            responses:
                '200':
                    description: |
                        Successful response with no synchronous states whose `complianceStatus` is
                        `INDETERMINATE`. This is also
                        the response used by asynchronous generation, whose newly claimed states are
                        normally returned as `IN_PROGRESS` with `PENDING` metrics. With `KEEP`, an
                        already stored state is returned unchanged and may already be terminal.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/State'
                            example:
                                success: true
                                message: States created and generated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      signatureId: 69cbea571d5009a043619276
                                      date: '2026-05-21T00:00:00.000Z'
                                      consolidated: true
                                      status: COMPLETED
                                      complianceStatus: COMPLIANT
                                error: null
                '207':
                    description: |
                        Synchronous generation completed, but at least one returned state has
                        `complianceStatus: INDETERMINATE`. The response still has `success: true`. Typical cases
                        are a snapshot cache miss during `REPLAY` (`status: COMPLETED` with an
                        `UNAVAILABLE` metric), a Computer/domain failure (`status: FAILED`), or a
                        numeric expression that did not produce a finite value. This response is not
                        used for `isAsync=true`.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/State'
                            example:
                                success: true
                                message: States created and generated
                                httpStatus: 207
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      signatureId: 69cbea571d5009a043619276
                                      date: '2026-05-21T00:00:00.000Z'
                                      status: COMPLETED
                                      numericExpressionValue: null
                                      complianceStatus: INDETERMINATE
                                      metrics:
                                          - metricName: COUNT_DONEISSUES_MEMBER
                                            status: UNAVAILABLE
                                            value: null
                                            evidences: []
                                            errorMessage: null
                                            metricConfig:
                                                event:
                                                    eventId: EV_ZENHUB_ISSUES_BY_COLUMN_FILTERED_BY_UPDATED_AT_DATE_ASSOCIATED_TO_MEMBER
                                                    fetcherConfigs:
                                                        - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                          fetcherConfig:
                                                              workspaceId: YOUR_ZENHUB_WORKSPACE_ID
                                                          fetchResult:
                                                              id: 665e5f6a7b8c9d0e1f2a3b4d
                                                              status: UNAVAILABLE
                                                              unavailableReason: PAST_SNAPSHOT_NOT_CAPTURED
                                                    processConfig:
                                                        columns:
                                                            - Done
                                                        username: johndoe
                                                aggregation:
                                                    aggregatorType: count
                                                    aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/states/consolidated/generate:
        post:
            tags:
                - States
            summary: Generate consolidated states for a selected agreement version
            operationId: generateConsolidatedStatesForAgreementVersion
            description: |
                Selects the agreement version using a one-based number (`1` selects
                `agreementVersions[0]`) or the literal `auditableVersion`. Generates states either
                for one exact consolidation `date` or for every
                consolidation date within the inclusive `startDate` and `endDate` range,
                using each signature guarantee window. When `date` is used, only guarantees
                with a consolidation point at that exact date produce a state.

                Every consolidation date is propagated independently as
                `temporalContext.effectiveAt`. The same fetch result reuse and acquisition rules
                apply at each date:

                | `temporalMode` | `SNAPSHOT` fetcher without a reusable exact result | `HISTORICAL` fetcher without a reusable exact result |
                | --- | --- | --- |
                | `CAPTURE` | Calls the external source and stores the result. | Calls the historical source and stores the result. |
                | `REPLAY` | Does not call the source; returns `UNAVAILABLE / PAST_SNAPSHOT_NOT_CAPTURED`. | Calls the historical source and stores the result. |

                Computer and state statuses are resolved independently for every generated state:

                | Metric outcomes | State status | `complianceStatus` | HTTP status when synchronous |
                | --- | --- | --- | --- |
                | Every metric is `COMPUTED` and the expression satisfies the comparator | `COMPLETED` | `COMPLIANT` | `200` |
                | Every metric is `COMPUTED` and the expression does not satisfy the comparator | `COMPLETED` | `NON_COMPLIANT` | `200` |
                | No metric is `FAILED`, but at least one is `UNAVAILABLE` | `COMPLETED` | `INDETERMINATE` | `207` |
                | At least one metric is `FAILED`, including a Computer non-success response | `FAILED` | `INDETERMINATE` | `207` |
                | Metrics are still being processed (`isAsync=true`) | `IN_PROGRESS` | `null` | `200` |

                A batch returns `207` when any synchronously generated state has
                `complianceStatus: INDETERMINATE`,
                even if the other states are determinate. Computer communication errors are caught
                per metric and stored as `FAILED` metrics with `errorMessage`.

                `KEEP` returns each existing `(signatureId, date)` state without recomputation.
                `REPLACE` reinitializes and recomputes it. With `isAsync=true`, claimed states are
                returned immediately with HTTP `200` and computation continues in the background.

                Both `temporalMode` and `ifExists` are required in the request body.
                Optional `signatureIds` uses the same all-or-nothing selection rules as regular
                state generation. Signatures are filtered before assembly and before consolidation
                dates are calculated.
            parameters:
                - $ref: '#/components/parameters/orgName'
                - $ref: '#/components/parameters/scopeId'
                - $ref: '#/components/parameters/agColId'
                - $ref: '#/components/parameters/agreementVersionSelector'
                - in: query
                  name: isAsync
                  required: false
                  schema:
                      type: boolean
                      default: false
                  description: If true, states are created and metric computation continues asynchronously.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - temporalMode
                                - ifExists
                            oneOf:
                                - required:
                                      - date
                                - required:
                                      - startDate
                                      - endDate
                            properties:
                                date:
                                    type: string
                                    format: date-time
                                    description: Exact consolidation date. Cannot be combined with `startDate` or `endDate`.
                                startDate:
                                    type: string
                                    format: date-time
                                    description: Inclusive lower bound for consolidation dates.
                                endDate:
                                    type: string
                                    format: date-time
                                    description: Inclusive upper bound for consolidation dates. Must be after or equal to `startDate`.
                                temporalMode:
                                    type: string
                                    enum: [CAPTURE, REPLAY]
                                    description: |
                                        Temporal acquisition policy used independently for every generated
                                        consolidation date. In `REPLAY`, snapshot fetchers are cache-only,
                                        while historical fetchers may query their source.
                                ifExists:
                                    type: string
                                    enum: [KEEP, REPLACE]
                                    description: |
                                        Existing-state policy applied independently to every generated state.
                                        `KEEP` skips recomputation for existing keys; `REPLACE` recomputes them.
                                signatureIds:
                                    type: array
                                    minItems: 1
                                    uniqueItems: true
                                    description: Optional subset of agreement signature ObjectIds. Omit to process every signature.
                                    items:
                                        type: string
                                        pattern: '^[a-fA-F0-9]{24}$'
                                        example: 69cbea571d5009a043619276
                        examples:
                            exactDate:
                                summary: Generate states at one consolidation date
                                value:
                                    date: '2026-05-21T00:00:00.000Z'
                                    temporalMode: REPLAY
                                    ifExists: KEEP
                                    signatureIds:
                                        - 69cbea571d5009a043619276
                            dateRange:
                                summary: Generate states within a date range
                                value:
                                    startDate: '2026-05-01T00:00:00.000Z'
                                    endDate: '2026-05-03T23:59:59.999Z'
                                    temporalMode: REPLAY
                                    ifExists: REPLACE
                                    signatureIds:
                                        - 69cbea571d5009a043619276
                                        - 69cbea571d5009a043619277
            responses:
                '200':
                    description: |
                        All synchronously returned states are determinate, or generation is
                        asynchronous. If no selected guarantee has a consolidation point in the
                        requested date or range, `data` is an empty array and the response message
                        explains that no points were found.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/State'
                            example:
                                success: true
                                message: Consolidated states created and generated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4c
                                      signatureId: 69cbea571d5009a043619276
                                      startDate: '2026-05-21T00:00:01.000Z'
                                      endDate: '2026-05-21T00:00:03.000Z'
                                      date: '2026-05-21T00:00:00.000Z'
                                      consolidated: true
                                      status: COMPLETED
                                      numericExpression: COUNT_DONEISSUES_MEMBER
                                      comparator: '>='
                                      threshold: 1
                                      replacedNumericExpression: '2'
                                      numericExpressionValue: 2
                                      complianceStatus: COMPLIANT
                                      window:
                                          anchorDate: '2026-05-14T00:00:00.000Z'
                                          period:
                                              - unit: week
                                                value: 1
                                      metrics:
                                          - metricName: COUNT_DONEISSUES_MEMBER
                                            status: COMPUTED
                                            value: 2
                                            evidences: []
                                            errorMessage: null
                                            metricConfig:
                                                event:
                                                    eventId: EV_ZENHUB_ISSUES_BY_COLUMN_FILTERED_BY_UPDATED_AT_DATE_ASSOCIATED_TO_MEMBER
                                                    fetcherConfigs:
                                                        - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                          fetcherConfig:
                                                              workspaceId: YOUR_ZENHUB_WORKSPACE_ID
                                                          fetchResult:
                                                              id: 665e5f6a7b8c9d0e1f2a3b4d
                                                              status: COMPLETED
                                                              unavailableReason: null
                                                    processConfig:
                                                        columns:
                                                            - Done
                                                        username: johndoe
                                                aggregation:
                                                    aggregatorType: count
                                                    aggregatorConfig: {}
                                error: null
                '207':
                    description: |
                        Synchronous generation completed with at least one state whose
                        `complianceStatus` is `INDETERMINATE`.
                        This includes `COMPLETED` states containing `UNAVAILABLE` metrics and
                        `FAILED` states containing failed metrics. The response remains successful
                        (`success: true`) and may also contain determinate states.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/State'
                            example:
                                success: true
                                message: Consolidated states created and generated
                                httpStatus: 207
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b4e
                                      signatureId: 69cbea571d5009a043619276
                                      startDate: '2026-05-21T00:00:01.000Z'
                                      endDate: '2026-05-21T00:00:03.000Z'
                                      date: '2026-05-21T00:00:00.000Z'
                                      consolidated: true
                                      status: FAILED
                                      numericExpression: COUNT_DONEISSUES_MEMBER
                                      comparator: '>='
                                      threshold: 1
                                      replacedNumericExpression: null
                                      numericExpressionValue: null
                                      complianceStatus: INDETERMINATE
                                      window:
                                          anchorDate: '2026-05-14T00:00:00.000Z'
                                          period:
                                              - unit: week
                                                value: 1
                                      metrics:
                                          - metricName: COUNT_DONEISSUES_MEMBER
                                            status: FAILED
                                            value: null
                                            evidences: []
                                            errorMessage: null
                                            metricConfig:
                                                event:
                                                    eventId: EV_ZENHUB_ISSUES_BY_COLUMN_FILTERED_BY_UPDATED_AT_DATE_ASSOCIATED_TO_MEMBER
                                                    fetcherConfigs:
                                                        - fetcherId: FT_GQL_ZENHUB_ISSUES
                                                          fetcherConfig:
                                                              workspaceId: YOUR_ZENHUB_WORKSPACE_ID
                                                          fetchResult:
                                                              id: 665e5f6a7b8c9d0e1f2a3b4f
                                                              status: FAILED
                                                              unavailableReason: null
                                                    processConfig:
                                                        columns:
                                                            - Done
                                                        username: johndoe
                                                aggregation:
                                                    aggregatorType: count
                                                    aggregatorConfig: {}
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/tasks/states/consolidated:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersionSelector'
        get:
            tags:
                - States
            summary: Get recurring consolidated-state tasks for an agreement version
            operationId: getConsolidationStateTasksForAgreementVersion
            description: |
                Returns the Director `generateConsolidatedStates` tasks associated with the selected
                agreement version. `auditableVersion` is resolved to the current one-based numeric
                `agreementVersion` before searching.


                Registry restricts the Director search by `script`, the agreement collection id stored
                in each task (`inputArgs.agColId`), and the resolved numeric `inputArgs.agreementVersion`.
                Tasks for fetchers, other agreement collections, or other agreement versions are not
                returned. When there are no matching tasks, `data` is an empty array.
            responses:
                '200':
                    description: Consolidation state tasks retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/RecurringStateTask'
                            example:
                                success: true
                                message: Consolidation state tasks retrieved
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b5b
                                      script: generateConsolidatedStates
                                      inputArgs:
                                          orgName: universidad-sevilla
                                          scopeId: 665e5f6a7b8c9d0e1f2a3b41
                                          orgId: 665e5f6a7b8c9d0e1f2a3b40
                                          agColId: 665e5f6a7b8c9d0e1f2a3b42
                                          agreementVersion: 2
                                          signatureId: 69cbea571d5009a043619276
                                      type: RECURRING
                                      enabled: true
                                      startDate: '2026-05-01T00:00:00.000Z'
                                      endDate: '2026-09-01T00:00:00.000Z'
                                      anchorDate: '2026-05-08T00:00:00.000Z'
                                      interval: 604800000
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - States
            summary: Create recurring consolidated-state tasks per signature
            operationId: createConsolidationStateTasksForAgreementVersion
            description: |
                Creates one recurring Director `generateConsolidatedStates` task for every selected
                signature in the agreement version. When `signatureIds` is omitted, every signature
                is selected. When supplied, the non-empty selection is validated completely before
                any Director task is created, and only that selection is assembled.

                A request using `auditableVersion` is resolved when tasks are created. Each task
                stores the resulting one-based numeric `agreementVersion`, so it remains associated
                with that selected entry instead of following later auditable-version changes.
                If agreement version entries are deleted or reordered, their tasks must be removed
                or recreated because the endpoint selector is positional.

                Each signature produces a separate task because its guarantee owns its window:

                - `interval` is the signature window period converted to milliseconds.
                - `anchorDate` is the first consolidation instant, calculated as the window
                  `anchorDate + period`.
                - `startDate` and `endDate` are taken from agreement validity; an earlier
                  `earlyTermination` becomes the task end.
                - At execution time, Director sends the exact scheduled instant to Registry with
                  `temporalMode: CAPTURE`, `ifExists: KEEP`, `isAsync=true`, and only that task's
                  `signatureId`. Director awaits Registry's acceptance response, then releases its
                  BullMQ worker while metric computation continues asynchronously in Registry.

                Task creation requests are sent in parallel. If Director rejects one of them,
                Registry returns `422`; tasks already accepted by Director are not rolled back.
                Director deduplicates equivalent task definitions. Repeating the same request
                returns the existing tasks without scheduling additional executions.
            parameters:
                - in: query
                  name: enabled
                  required: false
                  schema:
                      type: boolean
                      default: true
                  description: Whether the newly created recurring tasks are enabled immediately.
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                signatureIds:
                                    type: array
                                    minItems: 1
                                    uniqueItems: true
                                    description: Signatures for which tasks are created. Omit to use all signatures.
                                    items:
                                        type: string
                                        pattern: '^[a-fA-F0-9]{24}$'
                        examples:
                            allSignatures:
                                summary: Create enabled tasks for every signature
                                value: {}
                            selectedSignatures:
                                summary: Create tasks for selected signatures
                                value:
                                    signatureIds:
                                        - 69cbea571d5009a043619276
                                        - 69cbea571d5009a043619277
            responses:
                '201':
                    description: Consolidation state tasks created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/RecurringStateTask'
                            example:
                                success: true
                                message: Consolidation state tasks created
                                httpStatus: 201
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b5b
                                      script: generateConsolidatedStates
                                      inputArgs:
                                          orgName: universidad-sevilla
                                          scopeId: 665e5f6a7b8c9d0e1f2a3b41
                                          orgId: 665e5f6a7b8c9d0e1f2a3b40
                                          agColId: 665e5f6a7b8c9d0e1f2a3b42
                                          agreementVersion: 2
                                          signatureId: 69cbea571d5009a043619276
                                      type: RECURRING
                                      enabled: true
                                      startDate: '2026-05-01T00:00:00.000Z'
                                      endDate: '2026-09-01T00:00:00.000Z'
                                      anchorDate: '2026-05-08T00:00:00.000Z'
                                      interval: 604800000
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - States
            summary: Delete recurring consolidated-state tasks for an agreement version
            operationId: deleteConsolidationStateTasksForAgreementVersion
            description: |
                Deletes the Director `generateConsolidatedStates` tasks associated with the selected
                agreement version. `auditableVersion` is resolved to the current one-based numeric
                `agreementVersion` before deleting.

                Registry always sends a restricted Director filter containing `script`,
                `inputArgs.agColId`, and the resolved numeric `inputArgs.agreementVersion`. The
                deletion therefore does not affect fetcher tasks, other agreement collections, or
                other agreement versions. Director also removes the matching tasks' execution records
                and active schedules. Repeating the request is safe and returns zero counters.
            responses:
                '200':
                    description: Consolidation state tasks deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/ConsolidationStateTaskDeletionResult'
                            example:
                                success: true
                                message: Consolidation state tasks deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    deletedTasksCount: 2
                                    deletedExecutionsCount: 14
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'
    # ──────────────────────────────────────────────
    # Fetchers
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/fetchers/fetch:
        post:
            tags:
                - Fetchers
            summary: Generate fetch results for a selected agreement version
            operationId: fetchAgreementVersionFetchResults
            description: |
                Generates the fetch results required by every metric in the selected agreement
                version. A numeric `agreementVersion` is one-based (`1` selects
                `agreementVersions[0]`); `auditableVersion` automatically resolves the collection's
                auditable version. Duplicate fetch
                configurations are processed only once.
            parameters:
                - $ref: '#/components/parameters/orgName'
                - $ref: '#/components/parameters/scopeId'
                - $ref: '#/components/parameters/agColId'
                - $ref: '#/components/parameters/agreementVersionSelector'
                - in: query
                  name: expand
                  required: false
                  schema:
                      type: boolean
                  description: If true, returns full fetch results. By default, only fetch result ids are returned.
                - in: query
                  name: isAsync
                  required: false
                  schema:
                      type: boolean
                      default: false
                  description: If true, fetch results are created and processed asynchronously.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - date
                            properties:
                                date:
                                    type: string
                                    format: date-time
                        example:
                            date: '2026-05-19T00:00:00.000Z'
            responses:
                '201':
                    description: Fetch results generated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  type: string
                            example:
                                success: true
                                message: Fetch results generated
                                httpStatus: 201
                                appCode: SUCCESS
                                data:
                                    - 665e5f6a7b8c9d0e1f2a3b4c
                                error: null
                '207':
                    description: Generation completed with one or more non-completed fetch results
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  type: string
                            example:
                                success: true
                                message: Fetch results generated with failures
                                httpStatus: 207
                                appCode: SUCCESS
                                data:
                                    - 665e5f6a7b8c9d0e1f2a3b4d
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/fetchers/consolidated:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersionSelector'
        get:
            tags:
                - Fetchers
            summary: Get planned consolidation fetches
            operationId: getConsolidationFetchesForAgreementVersion
            description: |
                Returns each unique fetcher configuration required by the selected agreement
                version together with its consolidation dates.
            responses:
                '200':
                    description: Consolidation fetches retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/ConsolidationFetch'
                            example:
                                success: true
                                message: Consolidation fetches retrieved
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - fetcherId: FT_GQL_ZENHUB_ISSUES
                                      fetcherConfig:
                                          workspaceId: YOUR_ZENHUB_WORKSPACE_ID
                                      consolidationDates:
                                          - '2026-05-21T00:00:00.000Z'
                                          - '2026-05-28T00:00:00.000Z'
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/tasks/fetchers/consolidated:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersionSelector'
        post:
            tags:
                - Fetchers
            summary: Create recurring consolidation fetch tasks
            operationId: createConsolidationFetchTasksForAgreementVersion
            description: |
                Creates a recurring Director `fetchFetcher` task for each unique combination of
                fetcher configuration and guarantee window used by the selected agreement version.
                Different windows produce different tasks because their anchor and interval differ.

                Each Director task is created with:

                - `inputArgs.fetcherId` and `inputArgs.fetcherConfig`, used by `fetchFetcher`.
                - `inputArgs.orgId`, `scopeId`, `agColId`, and `versionNumber`, stored as metadata
                  so Director tasks can later be searched, enabled, disabled, or deleted by scope.
                  `versionNumber` is the selected entry's domain version number, not its array index.
                - `type: RECURRING`, with `startDate` and `endDate` taken from agreement validity.
                - `anchorDate` and `interval` derived from the corresponding guarantee window.

                At execution time, Director passes the task's exact scheduled instant to Fetcher as
                `temporalContext.effectiveAt` with `mode: CAPTURE` and `isAsync=true`. Director awaits
                Fetcher's acceptance response, then releases its BullMQ worker while the external
                acquisition continues asynchronously in Fetcher. The temporal context is generated
                by Director and is not stored in `inputArgs`.

                Task creation requests are sent in parallel. If Director rejects one of them, Registry
                returns `422`; tasks already accepted by Director are not rolled back.
            parameters:
                - in: query
                  name: enabled
                  required: false
                  schema:
                      type: boolean
                      default: true
                  description: Whether the newly created recurring tasks are enabled immediately.
            responses:
                '200':
                    description: Consolidation fetch tasks created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/RecurringFetchTask'
                            example:
                                success: true
                                message: Consolidation fetch tasks created
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665e5f6a7b8c9d0e1f2a3b5a
                                      script: fetchFetcher
                                      inputArgs:
                                          fetcherId: FT_GQL_ZENHUB_ISSUES
                                          fetcherConfig:
                                              workspaceId: YOUR_ZENHUB_WORKSPACE_ID
                                          orgId: 665e5f6a7b8c9d0e1f2a3b40
                                          scopeId: 665e5f6a7b8c9d0e1f2a3b41
                                          agColId: 665e5f6a7b8c9d0e1f2a3b42
                                          versionNumber: 3
                                      type: RECURRING
                                      enabled: true
                                      startDate: '2026-05-01T00:00:00.000Z'
                                      endDate: '2026-09-01T00:00:00.000Z'
                                      anchorDate: '2026-05-01T00:00:00.000Z'
                                      interval: 604800000
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ExternalServiceError'
                '500':
                    $ref: '#/components/responses/InternalError'

# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        elementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the element field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: janedoe
        guaranteeName:
            name: guaranteeName
            in: path
            required: true
            description: Unique name of the guarantee template
            schema:
                type: string
            example: CORRELATION_INPROGRESSISSUES_NEWBRANCH
        agreementTemplateName:
            name: agreementTemplateName
            in: path
            required: true
            description: Unique name of the agreement template within the organization
            schema:
                type: string
            example: tpa-US-PSG2-2526
        scopeId:
            name: scopeId
            in: path
            required: true
            description: Id of the scope within the organization
            schema:
                type: string
            example: 69cbdee759092b362376ca17
        agreementVersionSelector:
            name: agreementVersion
            in: path
            required: true
            description: |
                Agreement version selector
            schema:
                type: string
                pattern: '^(auditableVersion|[1-9][0-9]*)$'
            examples:
                auditable:
                    summary: Resolve the current auditable version
                    value: auditableVersion
                byNumber:
                    summary: Select the first agreementVersions array entry
                    value: '1'
        agColId:
            name: agColId
            in: path
            required: true
            description: Agreement collection id
            schema:
                type: string
            example: 69cbe9901d5009a04361925d
        partId:
            name: partId
            in: path
            required: true
            description: MongoDB ObjectId of the element part
            schema:
                type: string
            example: 665c2d3e4f5a6b7c8d9e0f1a
        permissionName:
            name: permissionName
            in: path
            required: true
            description: Permission type (view, edit, delete, create)
            schema:
                type: string
                enum: [view, edit, delete, create]
            example: view

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: Data to create or update an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        RoleBody:
            description: Data to create or update a role
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        FieldBody:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Element title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementFieldInput'
                    examples:
                        numericField:
                            summary: Numeric guarantee field
                            value:
                                name: minResponseTime
                                description: Minimum response time in hours
                                type: number
                        enumField:
                            summary: Enum guarantee level field
                            value:
                                name: guaranteeLevel
                                description: Service level guarantee tier
                                type: enum
                                value:
                                    - gold
                                    - silver
                                    - bronze

        MemberBody:
            description: Data to add a user to an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MemberInput'
                    example:
                        username: janedoe

        ElementBody:
            description: Data to create or update an element
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementInput'
                    example:
                        name: L1-01
                        description: Equipo L1-01 de PSG2
                        fields: []
                        permissions:
                            view: []
                            edit: []
                            delete: []
                            create: []
                        auditConfig:
                            owner: universidad-sevilla
                            repository: L1-01-project
                        parts:
                            - auditConfig:
                                  credentials:
                                      github:
                                          username: juan

        ElementPartBody:
            description: Data to create or update an element part
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementPartInput'
                    example:
                        auditConfig:
                            owner: universidad-sevilla
                            repository: L1-01-project

        ElementPermissionRolesBody:
            description: Roles to add to an element permission
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - roles
                        properties:
                            roles:
                                type: array
                                items:
                                    type: string
                                minItems: 1
                    example:
                        roles:
                            - admin

        AgreementTemplateBody:
            description: Data to create or update an agreement template
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementTemplateInput'
                    example:
                        name: tpa-US-PSG2-2526
                        displayName: TPA US PSG2 2526
                        description: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                        isPublic: true
                        guarantees:
                            - guaranteeTemplateName: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                              comparator: '>='
                              threshold: 75
                              window:
                                  period:
                                      - unit: hour
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: CORRELATION_BRANCHESASSOCIATED_INPROGRESSISSUES
                              comparator: '>='
                              threshold: 75
                              window:
                                  period:
                                      - unit: hour
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: CORRELATION_INREVIEWISSUES_OPENPR
                              comparator: '>='
                              threshold: 75
                              window:
                                  period:
                                      - unit: hour
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: CORRELATION_DONEISSUES_MERGEDPR
                              comparator: '>='
                              threshold: 75
                              window:
                                  period:
                                      - unit: hour
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: NUMBER_INPROGRESSISSUES_HOURLY_UNDER_1
                              comparator: '<='
                              threshold: 1
                              window:
                                  period:
                                      - unit: hour
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: NUMBER_DONEISSUES_WEEKLY_OVER_1
                              comparator: '>='
                              threshold: 1
                              window:
                                  period:
                                      - unit: week
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_TEAM
                              comparator: '>='
                              threshold: 75
                              window:
                                  period:
                                      - unit: week
                                        value: 1
                                  anchorDate: '2024-01-01T00:00:00.000Z'
                            - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_MEMBER

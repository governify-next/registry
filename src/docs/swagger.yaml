# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        elementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the element field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: janedoe
        guaranteeName:
            name: guaranteeName
            in: path
            required: true
            description: Unique name of the guarantee template
            schema:
                type: string
            example: GR_ELEMENT_xx_GITHUB_xx_TEAM_NUMBER_COMMITS
        agreementTemplateName:
            name: agreementTemplateName
            in: path
            required: true
            description: Unique name of the agreement template within the organization
            schema:
                type: string
            example: PSG2-2526
        elementName:
            name: elementName
            in: path
            required: true
            description: Unique name of the element within the organization
            schema:
                type: string
            example: L1-01
        agColName:
            name: agColName
            in: path
            required: true
            description: Unique name of the agreement collection within the element
            schema:
                type: string
            example: acuerdo-PSG2-2526
        versionNumber:
            name: versionNumber
            in: path
            required: true
            description: Version number of the agreement version
            schema:
                type: integer
                minimum: 1
            example: 1
        partId:
            name: partId
            in: path
            required: true
            description: MongoDB ObjectId of the element part
            schema:
                type: string
            example: 665c2d3e4f5a6b7c8d9e0f1a
        permissionName:
            name: permissionName
            in: path
            required: true
            description: Permission type (view, edit, delete, create)
            schema:
                type: string
                enum: [view, edit, delete, create]
            example: view

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: Data to create or update an organization
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        RoleBody:
            description: Data to create or update a role
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        FieldBody:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Element title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:

                                                        description: When an issue moves to In Progress, an associated branch must be created.
                                                        example: If 4 of 5 issues have a branch, the result is 80%.
                                                    numericExpression: '(COUNT_INPROGRESS_ISSUES_WITH_ASSOCIATED_BRANCHES/COUNT_INPROGRESS_ISSUES*100)'

                '200':
                    description: List of agreement templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665f1a2b3c4d5e6f7a8b9c0d
                                      name: tpa-US-PSG2-2526
                                      displayName: TPA US PSG2 2526
                                      description: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                                      orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                      isPublic: true
                                      __v: 0
                                      guarantees:
                                          - guaranteeTemplateName: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_BRANCHESASSOCIATED_INPROGRESSISSUES
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_INREVIEWISSUES_OPENPR
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_DONEISSUES_MERGEDPR
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_INPROGRESSISSUES_HOURLY_UNDER_1
                                            comparator: '<='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: hour
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_DONEISSUES_WEEKLY_OVER_1
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_TEAM
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_MEMBER
                                            comparator: '>='
                                            threshold: 75
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_APPROVEDMERGEDPULLREQUEST_MEMBER
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: CORRELATION_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER_AND_COUNTPR
                                            comparator: '>='
                                            threshold: 20
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                          - guaranteeTemplateName: NUMBER_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER
                                            comparator: '>='
                                            threshold: 1
                                            window:
                                                period:
                                                    - unit: week
                                                      value: 1
                                                anchorDate: '2024-01-01T00:00:00.000Z'
                                error: null
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - AgreementTemplates
            summary: Create an agreement template
            operationId: createAgreementTemplateByOrganization
            description: |
                Creates a new agreement template within the specified organization,
                along with its associated guarantees. Each guarantee references an existing
                GuaranteeTemplate by name and injects the concrete comparator, threshold and window when the agreement is enforced.
                The template name must be unique within the organization.
            requestBody:
                $ref: '#/components/requestBodies/AgreementTemplateBody'
            responses:
                '201':
                    description: Agreement template created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: Agreement template created
                                httpStatus: 201
                                appCode: SUCCESS
                                data:
                                    _id: 665f1a2b3c4d5e6f7a8b9c0d
                                    name: tpa-US-PSG2-2526
                                    displayName: TPA US PSG2 2526
                                    description: Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026
                                    orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                    isPublic: true
                                    __v: 0
                                    guarantees:
                                        - guaranteeTemplateName: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_BRANCHESASSOCIATED_INPROGRESSISSUES
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_INREVIEWISSUES_OPENPR
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_DONEISSUES_MERGEDPR
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_INPROGRESSISSUES_HOURLY_UNDER_1
                                          comparator: '<='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_DONEISSUES_WEEKLY_OVER_1
                                          comparator: '>='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_TEAM
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_APPROVEDMERGEDPULLREQUEST_TOTALMERGEDPULLREQUEST_MEMBER
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_APPROVEDMERGEDPULLREQUEST_MEMBER
                                          comparator: '>='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER_AND_COUNTPR
                                          comparator: '>='
                                          threshold: 20
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_COUNTPRSWITHATLEASTONECOMMENTORONEREVIEWCOMMENTBYMEMBER
                                          comparator: '>='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: week
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/AgreementTemplateConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/agreementTemplates/{agreementTemplateName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/agreementTemplateName'
        get:
            tags:
                - AgreementTemplates
            summary: Get an agreement template by name
            operationId: getAgreementTemplateByOrganization
            description: |
                Returns a specific agreement template identified by its name within the
                organization, assembled with its associated guarantees array.
            responses:
                '200':
                    description: Agreement template found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                '404':
                    $ref: '#/components/responses/AgreementTemplateNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - AgreementTemplates
            summary: Update an agreement template
            operationId: updateAgreementTemplateByOrganization
            description: |
                Updates an existing agreement template. All fields must be sent in the body.
                If the name changes, the new name must be unique within the organization.
                The guarantees array is fully replaced (wipe-and-replace strategy).
            requestBody:
                $ref: '#/components/requestBodies/AgreementTemplateBody'
            responses:
                '200':
                    description: Agreement template updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AgreementTemplate'
                            example:
                                success: true
                                message: Agreement template updated
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665f1a2b3c4d5e6f7a8b9c0d
                                    name: tpa-US-PSG2-2526
                                    displayName: TPA US PSG2 2526 V2
                                    description: Updated Team Practices Agreement for Universidad de Sevilla PSG2 2025-2026.
                                    orgId: 665a1b2c3d4e5f6a7b8c9d0e
                                    isPublic: false
                                    __v: 0
                                    guarantees:
                                        - guaranteeTemplateName: CORRELATION_INPROGRESSISSUES_NEWBRANCH
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_BRANCHESASSOCIATED_INPROGRESSISSUES
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_INREVIEWISSUES_OPENPR
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: CORRELATION_DONEISSUES_MERGEDPR
                                          comparator: '>='
                                          threshold: 75
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_INPROGRESSISSUES_HOURLY_UNDER_1
                                          comparator: '<='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: hour
                                                    value: 1
                                              anchorDate: '2024-01-01T00:00:00.000Z'
                                        - guaranteeTemplateName: NUMBER_DONEISSUES_WEEKLY_OVER_1
                                          comparator: '>='
                                          threshold: 1
                                          window:
                                              period:
                                                  - unit: week
